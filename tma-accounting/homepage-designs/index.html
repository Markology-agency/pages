<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>TMA Accounting: Homepage Designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef2f6;font-family:Roboto,Arial,sans-serif;color:#2B2B1B}
header{position:sticky;top:0;z-index:5;background:#24588D;color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;justify-content:space-between;box-shadow:0 4px 18px rgba(0,0,0,.18)}
header h1{margin:0;font:700 22px/1.1 "Roboto Condensed",Arial,sans-serif;letter-spacing:.01em}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav a{font:700 14px/1 "Roboto Condensed",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:#fff;border:2px solid rgba(255,255,255,.55);padding:10px 16px;border-radius:999px}
nav a.on{background:#F59E40;border-color:#F59E40;color:#2B2B1B}
main{max-width:1440px;margin:0 auto;padding:22px 16px 60px}
main img{display:block;width:100%;height:auto;background:#fff;box-shadow:0 10px 40px rgba(36,88,141,.18)}
</style>
</head>
<body>
<header>
<h1>TMA Accounting: Homepage Designs</h1>
<nav>
<a href="#b" data-v="b">Option B</a>
<a href="#c" data-v="c">Option C</a>
<a href="#b-notes" data-v="b-notes">Option B With Notes</a>
<a href="#c-notes" data-v="c-notes">Option C With Notes</a>
</nav>
</header>
<main><img id="shot" alt="TMA Accounting homepage design"></main>
<script>
var ALT={"b":"Homepage design, option B","c":"Homepage design, option C","b-notes":"Homepage design, option B, with notes on each section","c-notes":"Homepage design, option C, with notes on each section"};
function show(){var v=location.hash.replace("#","");if(!ALT[v])v="b";
  var img=document.getElementById("shot");img.src="option-"+v+".jpg";img.alt=ALT[v];
  document.querySelectorAll("nav a").forEach(function(a){a.classList.toggle("on",a.getAttribute("data-v")===v)});
  window.scrollTo(0,0)}
window.addEventListener("hashchange",show);show();
</script>
</body>
</html>
