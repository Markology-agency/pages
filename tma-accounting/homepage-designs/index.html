<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>TMA Accounting: Website Designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef2f6;font-family:Roboto,Arial,sans-serif;color:#2B2B1B}
header{position:sticky;top:0;z-index:5;background:#24588D;color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;justify-content:space-between;box-shadow:0 4px 18px rgba(0,0,0,.18)}
header h1{margin:0;font:700 22px/1.1 "Roboto Condensed",Arial,sans-serif;letter-spacing:.01em}
nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
nav a{font:700 14px/1 "Roboto Condensed",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:#fff;border:2px solid rgba(255,255,255,.55);padding:10px 16px;border-radius:999px}
nav a.on{background:#F59E40;border-color:#F59E40;color:#2B2B1B}
nav a.notes{margin-left:14px;border-style:dashed}
nav a.notes.on{background:#ffe66d;border-color:#ffe66d;border-style:solid}
main{max-width:1440px;margin:0 auto;padding:22px 16px 60px}
main img{display:block;width:100%;height:auto;background:#fff;box-shadow:0 10px 40px rgba(36,88,141,.18)}
</style>
</head>
<body>
<header>
<h1>TMA Accounting: Website Designs</h1>
<nav>
<a href="#" data-p="option-b">Homepage B</a>
<a href="#" data-p="option-c">Homepage C</a>
<a href="#" data-p="monthly-accounting">Monthly Accounting</a>
<a href="#" data-p="tax-services">Tax Services</a>
<a href="#" data-p="dental-practices">Dental Practices</a>
<a href="#" data-p="author-tyler-thompson">Author Bio</a>
<a href="#" data-p="playbook-a">Playbook A</a>
<a href="#" data-p="playbook-b">Playbook B</a>
<a href="playbook-b.html" target="_blank">Try Playbook B</a>
<a href="#" class="notes" id="notes">Show Notes</a>
</nav>
</header>
<main><img id="shot" alt="TMA Accounting website design"></main>
<script>
var PAGES={"option-b":"Homepage design, option B","option-c":"Homepage design, option C","monthly-accounting":"Monthly Accounting page design","tax-services":"Tax Services page design","dental-practices":"Dental Practices page design","author-tyler-thompson":"Author bio page design","playbook-a":"Small Business Playbook page, version A","playbook-b":"Small Business Playbook page, version B"};
var OLD={"b":"option-b","c":"option-c","b-notes":"option-b-notes","c-notes":"option-c-notes"};
function state(){var h=location.hash.replace("#","");if(OLD[h])h=OLD[h];var notes=/-notes$/.test(h);var p=h.replace(/-notes$/,"");if(!PAGES[p])p="option-b";return{p:p,notes:notes}}
function show(){var s=state();var img=document.getElementById("shot");
  img.src=s.p+(s.notes?"-notes":"")+".jpg";img.alt=PAGES[s.p]+(s.notes?", with notes on each section":"");
  document.querySelectorAll("nav a[data-p]").forEach(function(a){a.classList.toggle("on",a.getAttribute("data-p")===s.p)});
  var n=document.getElementById("notes");n.classList.toggle("on",s.notes);n.textContent=s.notes?"Hide Notes":"Show Notes"}
document.querySelectorAll("nav a[data-p]").forEach(function(a){a.addEventListener("click",function(e){e.preventDefault();var s=state();location.hash=a.getAttribute("data-p")+(s.notes?"-notes":"");window.scrollTo(0,0)})});
document.getElementById("notes").addEventListener("click",function(e){e.preventDefault();var s=state();location.hash=s.p+(s.notes?"":"-notes")});
window.addEventListener("hashchange",show);show();
</script>
</body>
</html>
