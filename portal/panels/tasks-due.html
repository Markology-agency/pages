async function rerun(){
  const btn=document.getElementById('rerun');
  btn.disabled=true; btn.textContent='Refreshing…';
  try{
    const r=await fetch('/api/tasks-due',{cache:'no-store'});
    const d=await r.json();
    if(d.error){ document.getElementById('gen').textContent='live error: '+d.error; }

  if(s.includes('progress'))return'st-progress';
  return'st-notstarted';}
function draw(){
  const q=(document.getElementById('q').value||'').toLowerCase().trim();

  document.getElementById('c-c').textContent=new Set(rows.map(r=>r.client).filter(c=>c!=='—')).size;

    <td><span class="pill">${t.dept}</span></td>
    <td><span class="pill ${stClass(t.status)}">${t.status}</span></td>

}
