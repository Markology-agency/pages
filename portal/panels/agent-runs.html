<style>

  table{width:100%;border-collapse:collapse;min-width:640px}

  th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line)}
  tbody tr{border-bottom:1px solid var(--line)}tbody tr:last-child{border-bottom:0}
  .name{font-weight:600}
  .pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600}
  .p-ok{color:var(--pos);background:rgba(63,179,127,.12)}
  .p-dead{color:var(--neg);background:rgba(229,104,111,.14)}
