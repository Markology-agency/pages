<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Ravira: SiteHeader</title>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header ref="{{ rootRef }}" style="position:relative;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:24px clamp(20px,5cqi,72px)">
  <a href="01-Homepage.dc.html" style="display:flex;align-items:center;gap:10px;font-family:'Instrument Serif',serif;font-size:34px;line-height:1;color:#27302A;text-decoration:none"><svg viewBox="0 0 200 200" style="width:38px;height:38px;flex:none" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M112 18 C88 50 132 72 100 102 C76 124 54 152 78 172 C100 188 146 172 142 148 C138 128 108 140 100 160" stroke="#27302A" stroke-width="13"></path><circle cx="150" cy="96" r="14" fill="#E27A5F"></circle></svg>Ravira</a>
  <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
    <nav style="display:flex;gap:30px;align-items:center;font-family:'Nunito Sans',sans-serif;font-size:15px">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
        <a href="{{ l.href }}" style="color:#27302A;text-decoration:{{ l.deco }};text-underline-offset:6px;text-decoration-color:#E27A5F;text-decoration-thickness:2px">{{ l.label }}</a>
      </sc-for>
      <a href="05-Contact.dc.html" style="background:#27302A;color:#FBFAF5;padding:13px 22px;border-radius:999px;font-weight:700;text-decoration:none;white-space:nowrap">Book a Free Consultation</a>
    </nav>
  </sc-if>
  <sc-if value="{{ compact }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;gap:8px;align-items:center;font-family:'Nunito Sans',sans-serif">
      <a href="05-Contact.dc.html" style="background:#27302A;color:#FBFAF5;padding:11px 16px;border-radius:999px;font-weight:700;font-size:13px;text-decoration:none;white-space:nowrap">Book a Free Consultation</a>
      <button type="button" aria-label="Menu" onClick="{{ toggle }}" style="width:44px;height:44px;border:none;background:transparent;font-size:24px;color:#27302A;cursor:pointer">≡</button>
    </div>
  </sc-if>
  <sc-if value="{{ menuShown }}" hint-placeholder-val="{{ false }}">
    <nav style="position:absolute;left:12px;right:12px;top:84px;background:#FBFAF5;border:1.5px solid #27302A;border-radius:20px;padding:8px 20px;display:flex;flex-direction:column;font-family:'Nunito Sans',sans-serif;font-size:17px">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
        <a href="{{ l.href }}" style="color:#27302A;text-decoration:none;padding:14px 0;border-bottom:1px solid #E3E9DC">{{ l.label }}</a>
      </sc-for>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1440px&quot;,&quot;height&quot;:&quot;100px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;about&quot;,&quot;coaching&quot;,&quot;workshops&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { compact: false, open: false };
  rootRef = React.createRef();
  componentDidMount() {
    const el = this.rootRef.current;
    if (!el) return;
    this.ro = new ResizeObserver(e => {
      const c = e[0].contentRect.width < 1000;
      if (c !== this.state.compact) this.setState({ compact: c, open: false });
    });
    this.ro.observe(el);
  }
  componentWillUnmount() { this.ro && this.ro.disconnect(); }
  renderVals() {
    const a = this.props.active || '';
    const links = [
      ['about', 'About', '04-About.dc.html'],
      ['coaching', '1:1 Coaching', '02-Coaching.dc.html'],
      ['workshops', 'Workshops & Constellations', '03-Workshops.dc.html'],
      ['contact', 'Contact', '05-Contact.dc.html']
    ].map(([k, label, href]) => ({ label, href, deco: k === a ? 'underline' : 'none' }));
    return {
      rootRef: this.rootRef, links,
      wide: !this.state.compact, compact: this.state.compact,
      menuShown: this.state.compact && this.state.open,
      toggle: () => this.setState(s => ({ open: !s.open }))
    };
  }
}
</script>
</body>
</html>
