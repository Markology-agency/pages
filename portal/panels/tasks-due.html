  .rerun{margin-left:auto;background:var(--accent);border:0;color:#fff;border-radius:9px;
    padding:8px 15px;font-size:14px;font-weight:600;cursor:pointer}

  .tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:820px}
  th,td{text-align:left;padding:10px 14px;vertical-align:top}
  th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em;
    border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
  tbody tr{border-bottom:1px solid var(--line)}
  tbody tr:last-child{border-bottom:0}
  tbody tr:hover{background:var(--panel2)}
  .client{color:var(--accent2);font-weight:600;white-space:nowrap}
  .task{max-width:440px}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;white-space:nowrap;

  .st-client{color:var(--accent2);border-color:rgba(125,164,244,.35)}
  .st-progress{color:var(--pos);border-color:rgba(63,179,127,.35)}

async function rerun(){
  const btn=document.getElementById('rerun');
  btn.disabled=true; btn.textContent='Refreshing…';
  try{
    const r=await fetch('/api/tasks-due',{cache:'no-store'});
    const d=await r.json();
    if(d.error){ document.getElementById('gen').textContent='live error: '+d.error; }
    else { T=(d.tasks||[]).filter(t=>!t.markology); document.getElementById('gen').textContent=(d.generated||'')+' · LIVE'; }
  }catch(e){ document.getElementById('gen').textContent='snapshot (portal service not running)'; }
  draw(); btn.disabled=false; btn.textContent='⟳ Rerun';
}
function stClass(s){s=(s||'').toLowerCase();
  if(s.includes('review')&&s.includes('client'))return'st-client';
  if(s.includes('review'))return'st-review';
  if(s.includes('progress'))return'st-progress';
  return'st-notstarted';}
function draw(){
  const q=(document.getElementById('q').value||'').toLowerCase().trim();
  const rows=T.filter(t=>!q||[t.client,t.name,t.dept,t.status,t.owner].join(' ').toLowerCase().includes(q));
  document.getElementById('c-n').textContent=rows.length;
  document.getElementById('c-c').textContent=new Set(rows.map(r=>r.client).filter(c=>c!=='—')).size;
  document.getElementById('c-r').textContent=rows.filter(r=>(r.status||'').toLowerCase().includes('review')).length;
  document.getElementById('rows').innerHTML=rows.map(t=>`<tr>
    <td class="client">${t.client}</td>
    <td class="task">${t.prio?'🔴 ':''}${t.name}</td>
    <td><span class="pill">${t.dept}</span></td>
    <td><span class="pill ${stClass(t.status)}">${t.status}</span></td>
    <td class="owner">${t.owner}</td></tr>`).join('');
}
