<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ashford Sky Offer Ads</title>
<style>
:root{--ink:#133048;--blue:#024070;--sky:#9ED0F0;--bg:#eef1f5;--fb:#f0f2f5;--line:#e4e6eb;--mute:#65676b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;padding:32px 16px 80px}
header{max-width:760px;margin:0 auto 22px;text-align:center}
h1{font-size:26px;letter-spacing:-.02em}
header p{color:#5b6b7c;margin-top:6px}
.tabs{display:flex;justify-content:center;gap:8px;margin:18px auto 26px}
.tabs button{border:1px solid #c9d2dc;background:#fff;color:var(--ink);font:600 14px/1 inherit;padding:11px 18px;border-radius:999px;cursor:pointer}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.phone{width:400px;max-width:100%;margin:0 auto;background:var(--fb);border-radius:36px;border:10px solid #111;box-shadow:0 20px 50px rgba(0,0,0,.18);overflow:hidden}
.screen{height:780px;overflow-y:auto;scroll-behavior:smooth}
.topbar{position:sticky;top:0;z-index:5;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.topbar b{color:#0866ff;font-size:26px;letter-spacing:-.04em}
.topbar span{display:flex;gap:8px}
.topbar i{width:32px;height:32px;border-radius:50%;background:#e4e6eb;display:block}
.post{background:#fff;margin-top:8px}
.ph{display:flex;align-items:center;gap:9px;padding:12px 12px 6px}
.av{width:40px;height:40px;border-radius:50%;background:#f0ede9;object-fit:contain;padding:4px;flex:none}
.who{display:flex;flex-direction:column;line-height:1.25;flex:1}
.nm{font-weight:600;font-size:14px}
.sp{font-size:12px;color:var(--mute)}
.txt{padding:2px 12px 10px;font-size:14px;white-space:pre-line}
.txt .more{color:var(--mute);font-weight:600;cursor:pointer}
.creative{display:block;width:100%;height:auto}
.lb{display:flex;align-items:center;gap:10px;background:var(--fb);padding:10px 12px}
.lbt{flex:1;min-width:0}
.dom{font-size:11px;text-transform:uppercase;color:var(--mute)}
.hl{font-weight:700;font-size:15px;line-height:1.25}
.ds{font-size:12px;color:var(--mute)}
.cta{background:#e4e6eb;border-radius:6px;padding:8px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.pf{display:flex;justify-content:space-around;padding:8px 4px;border-top:1px solid var(--line);color:var(--mute);font-size:13px}
.filler{filter:blur(5px);opacity:.75;pointer-events:none;user-select:none}
.filler .img{height:260px;background:linear-gradient(135deg,#c8d3c0,#e7d9c3 50%,#b9c8d8)}
.filler .img.b{background:linear-gradient(135deg,#e9c9b9,#cfd8e6 60%,#d9e3c9)}
.filler .img.c{height:200px;background:linear-gradient(135deg,#d4d0e8,#f1e6c8)}
.filler .gav{width:40px;height:40px;border-radius:50%;background:#b8c4d0;flex:none}
.tag{display:block;text-align:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#7a8899;padding:10px 0 0}
.note{max-width:760px;margin:26px auto 0;text-align:center;color:#5b6b7c;font-size:13px}
@media(max-width:440px){.phone{border-width:6px;border-radius:24px}.screen{height:auto;max-height:none}}
</style>
</head>
<body>
<header>
<h1>Ashford Sky: October offer ads</h1>
<p>This is how the new ads would look in someone's Facebook feed. Scroll inside the phone. The other posts are blurred so the ads stand out.</p>
</header>
<div class="tabs">
<button class="on" data-feed="qoe">Quality of Earnings, $7,500</button>
<button data-feed="tax">Year-end tax plan, $4,000</button>
</div>
<div class="phone"><div class="screen" id="screen"></div></div>
<p class="note">Tap "See more" on any ad to read the full text. Ad text is final draft copy. Images are the current designs.</p>

<script>
const ADS = {
 qoe: [
  {label:"QoE ad 1: The inventory count", img:"qoe-1-price.jpg",
   text:"Our full quality of earnings report is $7,500 flat for deals up to $5 million when you book by December 31. Our regular fee is $15,000.\nOn one retail deal we worked, the seller's books showed about $1.2 million in inventory. The physical count came back at about $490,000.\nA QoE catches gaps like that before you sign. We tie the seller's numbers to their bank statements and tax returns and test every add-back. Then we set your working capital target and flag what your lender will ask about.\nBook a call to walk through your deal. If you'd rather ask a question first, send us a message.",
   hl:"The books said $1.2M in inventory. The count said $490K.", ds:"Full QoE, $7,500 flat through Dec 31", cta:"Book now"},
  {label:"QoE ad 2: The add-back", img:"qoe-3-know-what-youre-buying.jpg",
   text:"Our full quality of earnings report is $7,500 flat for deals up to $5 million when you book by December 31. Our regular fee is $15,000.\nOn a franchise deal, one of the sellers was running a $100,000 \"marketing\" expense through the business. When we dug in, it looked tied to their personal life.\nAdd-backs like that look fine on a spreadsheet and fall apart when a lender asks for proof. We document every add-back with the support behind it, so you know which ones hold up before you sign.\nBook a call, or send us a message if you'd like to ask a question first.",
   hl:"That $100K \"marketing\" add-back looked personal when we dug in", ds:"Full QoE, $7,500 flat through Dec 31", cta:"Book now"},
  {label:"QoE ad 3: Half our usual fee", img:"qoe-2-600.jpg",
   text:"Through December 31, our full quality of earnings report is $7,500 flat for deals up to $5 million. That's half our regular $15,000 fee.\nWe've completed over 600 QoEs. Every report includes proof of cash, a tax return reconciliation, documented add-backs, a working capital target, a customer concentration review, a projection model and the full Q&A with the seller.\nIf you only need the cash checked, proof of cash on its own is $2,500.\nBook a call and tell us about the business you're buying.",
   hl:"Get a full QoE for $7,500, half our usual fee", ds:"Over 600 QoEs completed. Book by Dec 31.", cta:"Book now"}
 ],
 tax: [
  {label:"Tax plan ad 1: Bought a business this year", img:"tax-1-bought-a-business.jpg",
   text:"Our year-end tax plan for new business owners is $4,000, and you can keep your current accountant. If you move your accounting and tax to us later, we credit the full $4,000.\nA franchise owner we work with funded his business with a ROBS rollover. He expected the startup losses to lower his personal tax bill that year. Because of how the business was set up, they couldn't.\nNew owners often find surprises like that only after the year closes. Our plan reviews how your purchase price was split and what that means for write-offs. It also covers how you're paying yourself, your entity setup and your estimated payments, with the moves to make before December 31.\nBook a call and bring your closing statement.",
   hl:"Bought a business this year? Get a tax plan before Dec 31.", ds:"$4,000, credited if you stay with us", cta:"Book now"},
  {label:"Tax plan ad 2: Two or more franchise locations", img:"tax-3-franchise-locations.jpg",
   text:"Our year-end tax plan is $4,000 for owners of two or more franchise locations, and you can keep your current accountant.\nYou qualify if you run more than one location or you're opening another one. Each new location brings its own franchise fee and startup costs, and the fee gets written off over time instead of all in the year you pay it. Owners who expect a big first-year write-off are often surprised.\nWe look at each location's setup, your startup costs, how you're paying yourself and your estimated payments. You get one written plan for every location. If you move your accounting and tax to us later, we credit the full $4,000.\nBook a call and bring last year's returns.",
   hl:"Do you qualify for a multi-location tax plan?", ds:"For owners of 2+ franchise locations", cta:"Learn more"},
  {label:"Tax plan ad 3: The franchise fee", img:"tax-4-next-location.jpg",
   text:"Our year-end tax plan for owners of two or more franchise locations is $4,000, and you can keep your current accountant. If you move your accounting and tax to us later, we credit the full $4,000.\nIf you paid an up-front franchise fee for a new location this year, you can't write it all off this year. The fee gets spread out over time, so year one needs every other startup cost captured before the books close.\nOur plan looks at each location's setup, your startup costs, how you're paying yourself and your estimated payments. You get one written plan for every location, with the moves to make before December 31.\nBook a call and bring last year's returns.",
   hl:"Opened another location this year? Plan your taxes before Dec 31.", ds:"$4,000, credited if you stay with us", cta:"Book now"},
  {label:"Tax plan ad 4: Money-back version (option B)", img:"tax-2-keep-your-accountant.jpg",
   text:"Our year-end tax plan is $4,000, and if we don't find at least $8,000 in tax savings, twice our fee, you get your $4,000 back.\nYou qualify if you closed on a business in 2026 and nobody has planned your taxes since. If you bought the assets, how the purchase price was split between equipment, goodwill and other assets changes what you can write off and when. That split is usually in your purchase agreement, and your plan should use it.\nOur plan covers your purchase price split, owner pay, entity setup and estimated payments. You can keep your current accountant.\nBook a call and bring your closing statement.",
   hl:"$8,000 in tax savings, or your $4,000 back", ds:"Keep your accountant. Book by Dec 31.", cta:"Book now"}
 ]
};
const FILL = ["", "b", "c"];
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function filler(i){
 return `<div class="post filler" aria-hidden="true"><div class="ph"><div class="gav"></div><div class="who"><span class="nm">Someone you follow</span><span class="sp">3h</span></div></div>
 <div class="txt">Had the best weekend away with the family, can't believe how fast the kids are growing up.</div>
 <div class="img ${FILL[i%3]}"></div><div class="pf"><span>Like</span><span>Comment</span><span>Share</span></div></div>`;
}
function ad(a){
 const cut = a.text.indexOf("\n");
 const first = esc(a.text.slice(0, cut));
 return `<span class="tag">${esc(a.label)}</span><div class="post"><div class="ph"><img class="av" src="img/avatar.png" alt=""><div class="who"><span class="nm">Ashford Sky</span><span class="sp">Sponsored · 🌐</span></div><span class="sp">···</span></div>
 <div class="txt" data-full="${esc(a.text).replace(/"/g,"&quot;")}">${first}… <span class="more">See more</span></div>
 <img class="creative" src="img/${a.img}" alt="${esc(a.hl)}">
 <div class="lb"><div class="lbt"><div class="dom">ashfordsky.com</div><div class="hl">${esc(a.hl)}</div><div class="ds">${esc(a.ds)}</div></div><span class="cta">${a.cta}</span></div>
 <div class="pf"><span>👍 Like</span><span>💬 Comment</span><span>↗ Share</span></div></div>`;
}
function render(feed){
 let h = `<div class="topbar"><b>facebook</b><span><i></i><i></i><i></i></span></div>` + filler(0);
 ADS[feed].forEach((a,i)=>{ h += ad(a) + filler(i+1) + filler(i+2); });
 const s = document.getElementById("screen"); s.innerHTML = h; s.scrollTop = 0;
 s.querySelectorAll(".more").forEach(m=>m.addEventListener("click",e=>{const t=e.target.parentElement;t.textContent=t.dataset.full;}));
}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
 document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b)); render(b.dataset.feed);
}));
render("qoe");
</script>
</body>
</html>
