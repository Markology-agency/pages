<!DOCTYPE html>

<head>

<template id="__bundler_thumbnail">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<rect width="100" height="100" fill="#DBD300"/>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="photo-data.js"></script>

<script type="text/babel">
function Page() {
  return (
    <React.Fragment>
      <Nav ctaTheme="btn-black" />
      <Hero
        theme="t-yellow"
        solo
        sticker={<span>The FICA tip credit</span>}
        stickerTheme="s-black"
        headline={<span>YOU'RE OVERPAYING TAX ON EVERY <span style={{ fontStyle: "italic" }}>tip.</span></span>}
        sub="The FICA tip credit refunds part of the payroll tax you pay on employee tips. It's real money, it's federal, and most restaurant owners never claim it. VAST does."
        primaryTheme="btn-black"
        trust="A CPA who owns restaurants · Reno, NV"
      />

      <FicaCalc />

      <ProblemBand
        eyebrow="Why it gets missed"
        title={<span>The credit is sitting there. Is anyone <span className="it">claiming it?</span></span>}
        items={[
          { q: "Does your CPA even mention it?", a: "Generalist firms file your return and move on. The tip credit takes restaurant know-how." },
          { q: "Is your tip reporting clean enough?", a: "The credit depends on accurate, reconciled tip reporting. We make it claimable." },
          { q: "Are you claiming prior years?", a: "In many cases credits can be captured retroactively. We'll review what's recoverable." },
          { q: "Stacking it with other savings?", a: "Tip credit plus depreciation and deductions, we layer every restaurant tax break." },
        ]}
      />

      <Services
        theme="t-paper"
        eyebrow="How VAST claims it"
        title="From messy tips to money back."
        intro="We turn your tip data into a clean, defensible credit, and make sure it keeps coming every year."
        cards={[
          { icon: "calc", title: "Calculate the exact credit", body: "We compute your precise FICA tip credit against the wage floor, not a rule-of-thumb guess." },
          { icon: "receipt", title: "Clean up tip reporting", body: "Reconcile POS tips to payroll so the credit is accurate and audit-ready." },
          { icon: "scale", title: "File it correctly", body: "We claim the credit on your return and document it properly, every period." },
          { icon: "clock", title: "Look back where allowed", body: "Review prior years for credits that may still be recoverable." },
          { icon: "trend", title: "Stack every break", body: "Combine the tip credit with depreciation, deductions, and planning to cut total tax." },
          { icon: "shield", title: "Keep you compliant", body: "Stay onside with tipped-wage rules while maximizing what you legally keep." },
        ]}
      />

      <TanyaProof theme="t-cream" />

      <Testimonial
        theme="t-black"
        quote="They are intentional, thorough, and have set us up for more success than I ever thought possible. If I could give more than 10/10, I would."
        cite="Nenada Maslovaric · Old Barrel Tea Company"
      />

      <FAQ
        theme="t-paper"
        items={[
          { q: "Who qualifies for the FICA tip credit?", a: "Most food-and-beverage employers with tipped staff whose tips push pay above the federal minimum threshold. If you have servers or bartenders reporting tips, it's worth checking." },
          { q: "How big can the credit be?", a: "It depends on tip volume and your tipped headcount. The calculator above shows the scale; many restaurants recover thousands per year." },
          { q: "Do I need to switch accountants to claim it?", a: "Not necessarily, but you do need someone who knows restaurants. VAST can claim it as part of full service or assess it during an intro call." },
          { q: "Can I claim it for past years?", a: "Often yes, within IRS limits. We'll review what's recoverable when we look at your filings." },

      />

      <BookBand
        theme="t-black"
        title={<span>Stop leaving the tip credit <span className="mark">on the table.</span></span>}
        intro="Book an intro call. We'll estimate your credit and show you exactly how to claim it."
        primaryTheme="btn-yellow"
      />
