  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"96299a45-5b75-4c20-9b0a-22a0b1f376ae\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <style>\n    @font-face{font-family:'Euclid Circular B';src:url(\"fea61cce-93b6-4ea9-9b71-78ccd56cdf59\") format('truetype');font-weight:400;font-display:swap}\n    @font-face{font-family:'Euclid Circular B';src:url(\"ffd04239-fdae-467c-93d6-f65250958dd8\") format('truetype');font-weight:500;font-display:swap}\n    @font-face{font-family:'Euclid Circular B';src:url(\"8fad5f0a-f745-4f83-ac6c-f4f6a5529f5c\") format('truetype');font-weight:600;font-display:swap}\n    @font-face{font-family:'Euclid Circular B';src:url(\"6304bf73-790f-4071-8b59-63cffb00e02d\") format('truetype');font-weight:700;font-display:swap}\n    body{margin:0;background:#fff;-webkit-font-smoothing:antialiased}\n    a{color:#092d4f}a:hover{color:#123f68}\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"font-family:'Euclid Circular B','Poppins',system-ui,sans-serif;color:#092d4f;line-height:1.55;\">\n\n  <!-- Mockup switcher -->\n  <div style=\"background:#061f38;color:rgba(255,255,255,0.7);font-size:12px;padding:8px 24px;display:flex;gap:18px;align-items:center;\">\n    <span style=\"font-weight:600;color:#fff;\">Exit-planning mockups:<\u002Fspan>\n    <span style=\"color:#fff;border-bottom:1.5px solid #d5ecf6;padding-bottom:1px;\">1. Landing page<\u002Fspan>\n    <a href=\"Core Advisors Practice Value Calculator.html\" style=\"color:rgba(255,255,255,0.7);text-decoration:none;\">2. Calculator<\u002Fa>\n    <a href=\"Core Advisors Exit Planning Meta Ads.html\" style=\"color:rgba(255,255,255,0.7);text-decoration:none;\">3. Meta ads<\u002Fa>\n  <\u002Fdiv>\n\n  <!-- NAV -->\n  <div style=\"border-bottom:1px solid #dde7f1;background:#fff;position:sticky;top:0;z-index:40;\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;padding:16px 24px;max-width:1080px;margin:0 auto;\">\n      <img src=\"8f810da7-0e49-4fba-80a1-b47d6e100043\" alt=\"Core Advisors\" style=\"height:44px;width:auto;object-fit:contain;\">\n      <a href=\"#calc\" style=\"display:inline-block;border-radius:99px;padding:13px 26px;font-size:15px;font-weight:600;text-decoration:none;background:#d5ecf6;color:#092d4f;\">See your number<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- HERO -->\n  <div style=\"background:linear-gradient(155deg,#092d4f 0%,#0e3a63 100%);position:relative;overflow:hidden;\">\n    <div style=\"position:absolute;right:-160px;top:-140px;width:600px;height:600px;border-radius:50%;border:1px solid rgba(213,236,246,0.12);\"><\u002Fdiv>\n    <div style=\"position:absolute;right:0;bottom:-140px;width:540px;height:540px;border-radius:50%;background:rgba(213,236,246,0.07);\"><\u002Fdiv>\n    <div style=\"max-width:1080px;margin:0 auto;padding:0 24px;position:relative;\">\n      <img src=\"49af09ae-5bb5-4d67-91fc-9271275c87a3\" alt=\"Thomas Gore, CPA, CFP®\" style=\"position:absolute;right:-30px;bottom:0;height:97%;width:auto;object-fit:contain;object-position:bottom right;pointer-events:none;-webkit-mask-image:linear-gradient(to right,transparent 0%,rgba(0,0,0,0.55) 22%,#000 45%);mask-image:linear-gradient(to right,transparent 0%,rgba(0,0,0,0.55) 22%,#000 45%);\">\n      <div style=\"position:relative;z-index:2;padding:84px 0 76px;max-width:580px;\">\n        <p style=\"font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#d5ecf6;font-weight:600;margin:0 0 16px;opacity:0.85;\">For dental practice owners<\u002Fp>\n        <h1 style=\"font-size:52px;line-height:1.1;font-weight:700;letter-spacing:-0.02em;margin:0 0 20px;color:#fff;\">Selling your dental practice one day?<br><em style=\"font-style:normal;color:#d5ecf6;\">The price is being decided right now.<\u002Fem><\u002Fh1>\n        <p style=\"font-size:18px;color:rgba(255,255,255,0.72);margin:0 0 30px;max-width:52ch;\">Most of what a practice sells for is built in the years before it ever goes on the market, not at the closing table. See what yours is worth today, what a best-in-class version of the same practice is worth, and what's causing the difference.<\u002Fp>\n        <div style=\"display:flex;gap:14px;align-items:center;flex-wrap:wrap;\">\n          <a href=\"#calc\" style=\"display:inline-block;border-radius:99px;padding:17px 34px;font-size:16px;font-weight:600;text-decoration:none;background:#d5ecf6;color:#092d4f;\">See your number<\u002Fa>\n          <span style=\"font-size:13px;color:rgba(255,255,255,0.6);\">Free. About two minutes. No obligation.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;margin-top:26px;flex-wrap:wrap;\">\n          <span style=\"background:rgba(213,236,246,0.1);border:1px solid rgba(213,236,246,0.28);border-radius:8px;padding:8px 12px;font-size:11px;letter-spacing:0.05em;font-weight:600;color:#d5ecf6;\">CEPA® CERTIFIED EXIT PLANNING ADVISOR<\u002Fspan>\n          <span style=\"background:rgba(213,236,246,0.1);border:1px solid rgba(213,236,246,0.28);border-radius:8px;padding:8px 12px;font-size:11px;letter-spacing:0.05em;font-weight:600;color:#d5ecf6;\">EXIT PLANNING INSTITUTE<\u002Fspan>\n          <span style=\"background:rgba(213,236,246,0.1);border:1px solid rgba(213,236,246,0.28);border-radius:8px;padding:8px 12px;font-size:11px;letter-spacing:0.05em;font-weight:600;color:#d5ecf6;\">BUILT FOR DENTISTS ONLY<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:absolute;right:24px;bottom:24px;z-index:2;background:rgba(6,31,56,0.78);border:1px solid rgba(213,236,246,0.25);border-radius:12px;padding:10px 16px;\">\n        <div style=\"font-size:14px;font-weight:600;color:#fff;\">Thomas Gore, CPA, CFP®<\u002Fdiv>\n        <div style=\"font-size:12px;color:#d5ecf6;opacity:0.8;\">President, Core Advisors<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- NET WORTH -->\n  <section style=\"background:linear-gradient(155deg,#092d4f,#0e3a63);color:#fff;padding:84px 0;position:relative;overflow:hidden;\">\n    <div style=\"position:absolute;left:-140px;top:-160px;width:520px;height:520px;border-radius:50%;border:1px solid rgba(213,236,246,0.12);\"><\u002Fdiv>\n    <div style=\"max-width:760px;margin:0 auto;padding:0 24px;text-align:center;position:relative;\">\n      <p style=\"font-size:112px;font-weight:700;letter-spacing:-0.035em;line-height:0.95;margin:0;color:#d5ecf6;\">80-90%<\u002Fp>\n      <div style=\"display:flex;gap:5px;margin:26px auto 0;max-width:420px;\">\n        <div style=\"height:12px;flex:0 0 85%;background:#d5ecf6;border-radius:99px;\"><\u002Fdiv>\n        <div style=\"height:12px;flex:1;background:rgba(213,236,246,0.22);border-radius:99px;\"><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:13px;color:rgba(255,255,255,0.5);margin:12px 0 0;\">Net worth tied up in the business · Exit Planning Institute, figure for business owners generally<\u002Fp>\n      <h2 style=\"font-size:36px;line-height:1.15;font-weight:700;letter-spacing:-0.015em;margin:44px 0 18px;color:#fff;\">It's probably most of your net worth<\u002Fh2>\n      <p style=\"font-size:17px;color:rgba(255,255,255,0.78);margin:0 auto 14px;max-width:56ch;\">For most practice owners, the practice is the single biggest asset they'll ever hold. It's also, usually, the one they've measured the least.<\u002Fp>\n      <p style=\"font-size:16px;color:rgba(255,255,255,0.65);margin:0 auto;max-width:56ch;\">You know your production numbers cold. Far fewer owners have ever put a number on the thing all that production is building. That's a strange blind spot for the biggest line on your balance sheet, and it's a fixable one.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- THE GAP -->\n  <section style=\"padding:80px 0;\">\n    <div style=\"max-width:1080px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;\">\n      <div>\n        <p style=\"font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#5d7186;font-weight:600;margin:0 0 14px;\">The gap<\u002Fp>\n        <h2 style=\"font-size:36px;line-height:1.15;font-weight:700;letter-spacing:-0.015em;margin:0 0 18px;\">Two identical practices, two very different numbers<\u002Fh2>\n        <p style=\"font-size:17px;color:#3d5266;margin:0 0 14px;\">Same collections. Same chairs. Same patients walking through the door. One sells for meaningfully more, and the difference usually has nothing to do with dentistry.<\u002Fp>\n        <p style=\"font-size:16px;color:#3d5266;margin:0;\">Every buyer is quietly asking one question: does this practice work when the owner isn't in it? Anything that only runs because you're standing there gets priced in, every time.<\u002Fp>\n        <div style=\"border-left:3px solid #3a975b;padding-left:18px;margin:24px 0 0;font-size:17px;font-weight:500;color:#092d4f;\">Buyers don't pay for how good a dentist you are. They pay for what keeps working after you hand over the keys.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:16px;\">\n        <div style=\"background:#fff;border:1px solid #dde7f1;border-radius:16px;padding:26px 28px;box-shadow:0 6px 28px rgba(9,45,79,0.06);\">\n          <p style=\"font-size:13px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#5d7186;margin:0 0 10px;\">Dr. A's practice<\u002Fp>\n          <p style=\"font-size:24px;font-weight:700;margin:0;\">Runs on the doctor<\u002Fp>\n          <div style=\"height:8px;border-radius:99px;background:#eaf1f8;margin-top:18px;overflow:hidden;\"><div style=\"width:42%;height:100%;background:#9db8d0;border-radius:99px;\"><\u002Fdiv><\u002Fdiv>\n          <p style=\"font-size:14px;color:#5d7186;margin:10px 0 0;\">Buyers discount what leaves with you<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#092d4f;color:#fff;border-radius:16px;padding:26px 28px;box-shadow:0 12px 36px rgba(9,45,79,0.25);\">\n          <p style=\"font-size:13px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#d5ecf6;opacity:0.75;margin:0 0 10px;\">Dr. B's practice<\u002Fp>\n          <p style=\"font-size:24px;font-weight:700;margin:0;\">Runs on its own<\u002Fp>\n          <div style=\"height:8px;border-radius:99px;background:rgba(213,236,246,0.2);margin-top:18px;overflow:hidden;\"><div style=\"width:92%;height:100%;background:#3a975b;border-radius:99px;\"><\u002Fdiv><\u002Fdiv>\n          <p style=\"font-size:14px;color:#d5ecf6;opacity:0.8;margin:10px 0 0;\">Buyers pay a premium for structure<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- UPSIDE -->\n  <section style=\"padding:80px 0;\">\n    <div style=\"max-width:1080px;margin:0 auto;padding:0 24px;\">\n      <div style=\"max-width:760px;\">\n        <p style=\"font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#5d7186;font-weight:600;margin:0 0 14px;\">Profit vs. value<\u002Fp>\n        <h2 style=\"font-size:36px;line-height:1.15;font-weight:700;letter-spacing:-0.015em;margin:0 0 16px;\">Making good money and being worth a lot are two different things<\u002Fh2>\n        <p style=\"font-size:17px;color:#3d5266;margin:0;max-width:62ch;\">A practice can pay you very well for years and still sell for less than you'd expect. They're built differently.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:36px;\">\n        <div style=\"background:#d5ecf6;border-radius:16px;padding:30px 32px;\">\n          <p style=\"font-size:13px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#155081;margin:0 0 10px;\">Profit<\u002Fp>\n          <p style=\"font-size:26px;font-weight:700;margin:0;color:#092d4f;\">Pays you now<\u002Fp>\n          <p style=\"font-size:15px;color:#3d5266;margin:12px 0 0;line-height:1.6;\">What the practice pays you this year: production, collections, take-home. You already manage this well.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#092d4f;border-radius:16px;padding:30px 32px;color:#fff;\">\n          <p style=\"font-size:13px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#d5ecf6;opacity:0.8;margin:0 0 10px;\">Value<\u002Fp>\n          <p style=\"font-size:26px;font-weight:700;margin:0;\">Pays you once<\u002Fp>\n          <p style=\"font-size:15px;color:rgba(255,255,255,0.75);margin:12px 0 0;line-height:1.6;\">What someone else will pay for the practice later. Built from structure, team, and systems, in the years before a sale.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:16px;color:#3d5266;margin:26px 0 0;max-width:70ch;\">The good part: the gap between the two is yours to close, and closing it doesn't require selling anything or changing your timeline. The same work that makes a practice worth more to a buyer also makes it a better practice to own in the meantime: fewer bottlenecks, a stronger team, and a business that doesn't need you in the building to have a good week.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- DRIVERS -->\n  <section style=\"padding:70px 0;background:#f7fafd;border-top:1px solid #dde7f1;border-bottom:1px solid #dde7f1;\">\n    <div style=\"max-width:1080px;margin:0 auto;padding:0 24px;\">\n      <h2 style=\"font-size:34px;line-height:1.2;font-weight:700;letter-spacing:-0.015em;margin:0 0 18px;max-width:20ch;\">What actually moves the number<\u002Fh2>\n      <p style=\"font-size:17px;color:#3d5266;margin:0 0 16px;max-width:62ch;\">These are the things a buyer looks for, and every one of them is something you can build on purpose.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:34px;\">\n        <div style=\"background:#fff;border:1px solid #dde7f1;border-radius:12px;padding:22px;\">\n          <div style=\"width:28px;height:28px;border-radius:8px;background:#d5ecf6;color:#092d4f;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:12px;\">1<\u002Fdiv>\n          <h3 style=\"margin:0 0 7px;font-size:16px;font-weight:600;\">It runs without you<\u002Fh3>\n          <p style=\"margin:0;font-size:14px;color:#5d7186;line-height:1.6;\">A strong associate and hygiene bench means production doesn't depend on you being chairside every day.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #dde7f1;border-radius:12px;padding:22px;\">\n          <div style=\"width:28px;height:28px;border-radius:8px;background:#d5ecf6;color:#092d4f;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:12px;\">2<\u002Fdiv>\n          <h3 style=\"margin:0 0 7px;font-size:16px;font-weight:600;\">The systems are written down<\u002Fh3>\n          <p style=\"margin:0;font-size:14px;color:#5d7186;line-height:1.6;\">Scheduling, hygiene recall, case presentation, billing, collections. Documented, and actually followed.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #dde7f1;border-radius:12px;padding:22px;\">\n          <div style=\"width:28px;height:28px;border-radius:8px;background:#d5ecf6;color:#092d4f;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:12px;\">3<\u002Fdiv>\n          <h3 style=\"margin:0 0 7px;font-size:16px;font-weight:600;\">Patients belong to the practice<\u002Fh3>\n          <p style=\"margin:0;font-size:14px;color:#5d7186;line-height:1.6;\">Relationships sit with the whole care team and the brand, not only with the owner-doctor.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #dde7f1;border-radius:12px;padding:22px;\">\n          <div style=\"width:28px;height:28px;border-radius:8px;background:#d5ecf6;color:#092d4f;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:12px;\">4<\u002Fdiv>\n          <h3 style=\"margin:0 0 7px;font-size:16px;font-weight:600;\">There's a leadership bench<\u002Fh3>\n          <p style=\"margin:0;font-size:14px;color:#5d7186;line-height:1.6;\">An office manager, a lead hygienist, a lead assistant. Decisions don't bottleneck at you.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #dde7f1;border-radius:12px;padding:22px;\">\n          <div style=\"width:28px;height:28px;border-radius:8px;background:#d5ecf6;color:#092d4f;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:12px;\">5<\u002Fdiv>\n          <h3 style=\"margin:0 0 7px;font-size:16px;font-weight:600;\">The numbers are clean and current<\u002Fh3>\n          <p style=\"margin:0;font-size:14px;color:#5d7186;line-height:1.6;\">Production, collections, hygiene %, case acceptance, chair utilization. Tracked, and acted on.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #dde7f1;border-radius:12px;padding:22px;\">\n          <div style=\"width:28px;height:28px;border-radius:8px;background:#d5ecf6;color:#092d4f;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:12px;\">6<\u002Fdiv>\n          <h3 style=\"margin:0 0 7px;font-size:16px;font-weight:600;\">You have more than one way out<\u002Fh3>\n          <p style=\"margin:0;font-size:14px;color:#5d7186;line-height:1.6;\">DSO, private buyer, partner buy-in, associate buy-in. Options exist when the value transfers with the practice.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CALCULATOR -->\n  <div id=\"calc\" style=\"background:linear-gradient(160deg,#eef4fa,#d5ecf6);padding:70px 0;\">\n    <div style=\"max-width:1080px;margin:0 auto;padding:0 24px;\">\n      <div style=\"max-width:820px;margin:0 auto;text-align:center;\">\n        <h2 style=\"font-size:34px;line-height:1.2;font-weight:700;letter-spacing:-0.015em;margin:0 auto 14px;\">See your number, and your gap<\u002Fh2>\n        <p style=\"font-size:17px;color:#3d5266;margin:0 auto;\">Five questions about your numbers, five about how the practice runs. About two minutes, and nothing you need to look up.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"max-width:836px;margin:34px auto 0;background:#fff;border-radius:16px;box-shadow:0 6px 32px rgba(9,45,79,0.08);padding:44px 40px;text-align:center;\">\n        <p style=\"font-size:20px;font-weight:600;color:#092d4f;margin:0 0 8px;\">Practice Value Calculator<\u002Fp>\n        <p style=\"font-size:15px;color:#5d7186;margin:0 0 22px;\">Ten questions, about two minutes. Opens in its own page.<\u002Fp>\n        <a href=\"Core Advisors Practice Value Calculator.html\" style=\"display:inline-block;border-radius:99px;padding:16px 32px;font-size:16px;font-weight:600;text-decoration:none;background:#092d4f;color:#fff;\">Open the calculator<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- TEAM -->\n  <section style=\"padding:70px 0;\">\n    <div style=\"max-width:820px;margin:0 auto;padding:0 24px;\">\n      <h2 style=\"font-size:34px;line-height:1.2;font-weight:700;letter-spacing:-0.015em;margin:0 0 18px;max-width:22ch;\">Increasing practice value is what our team does<\u002Fh2>\n      <p style=\"font-size:17px;color:#3d5266;margin:0 0 16px;max-width:62ch;\">Core Advisors works with dentists, and only with dentists. Accounting, tax, retirement, and investment strategy all sit under one roof, so your practice number and your personal number get planned by people who actually talk to each other.<\u002Fp>\n      <p style=\"font-size:16px;color:#3d5266;margin:0 0 14px;max-width:62ch;\">The specific thing the team is built around is the subject of this page: growing what the practice is worth. Not only filing the return and reconciling the books, though that happens too. Working on the things a buyer will one day pay a premium for, in the years when you can still change them.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:30px;\">\n        <div style=\"background:#fff;border:1px solid #dde7f1;border-radius:16px;overflow:hidden;box-shadow:0 6px 32px rgba(9,45,79,0.06);\">\n          <img src=\"efb6c098-584c-4658-8719-a97f4e902b3a\" alt=\"Jeremiah D. Barwick, CEPA®\" style=\"width:100%;height:260px;object-fit:cover;object-position:top;display:block;\">\n          <div style=\"padding:20px 22px 22px;\">\n            <h3 style=\"margin:0 0 3px;font-size:19px;font-weight:600;\">Jeremiah D. Barwick, CEPA®<\u002Fh3>\n            <p style=\"margin:0 0 12px;color:#5d7186;font-size:13px;\">Lead Advisor, Core Advisors<\u002Fp>\n            <p style=\"font-size:14px;color:#3d5266;margin:0;line-height:1.6;\">Jeremiah is a Certified Exit Planning Advisor, a credential from the Exit Planning Institute built around one idea: the work that makes a practice valuable to a buyer is the same work that makes it better to own right now.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #dde7f1;border-radius:16px;overflow:hidden;box-shadow:0 6px 32px rgba(9,45,79,0.06);\">\n          <img src=\"8a178f46-714b-4cca-ac9e-54577263ded9\" alt=\"Thomas Gore, CPA, CFP®\" style=\"width:100%;height:260px;object-fit:cover;object-position:top;display:block;\">\n          <div style=\"padding:20px 22px 22px;\">\n            <h3 style=\"margin:0 0 3px;font-size:19px;font-weight:600;\">Thomas Gore, CPA, CFP®<\u002Fh3>\n            <p style=\"margin:0 0 12px;color:#5d7186;font-size:13px;\">President, Core Advisors<\u002Fp>\n            <p style=\"font-size:14px;color:#3d5266;margin:0;line-height:1.6;\">Thomas leads the accounting and tax side of the practice-value work: the clean, current numbers a buyer will one day pay a premium for, kept clean in the years when they can still be changed.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:34px;\">\n        <div style=\"background:#fff;border:1px solid #dde7f1;border-radius:12px;padding:24px;\">\n          <p style=\"font-size:38px;font-weight:700;letter-spacing:-0.02em;margin:0 0 6px;color:#092d4f;\">95%<\u002Fp>\n          <p style=\"margin:0 0 10px;font-size:15px;color:#3d5266;\">of M&amp;A professionals say the top reason deals fall apart is the owner overestimating what the business is worth. Knowing your real number early is the whole point of starting now.<\u002Fp>\n          <p style=\"font-size:11px;color:#5d7186;border-top:1px solid #dde7f1;padding-top:9px;margin:0;\">Alliance of M&amp;A Advisors, cited in the Exit Planning Institute's <i>From Successful to Significant<\u002Fi> white paper. Figure is for business owners generally, not dentists specifically.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #dde7f1;border-radius:12px;padding:24px;\">\n          <p style=\"font-size:38px;font-weight:700;letter-spacing:-0.02em;margin:0 0 6px;color:#092d4f;\">80% to 90%<\u002Fp>\n          <p style=\"margin:0 0 10px;font-size:15px;color:#3d5266;\">of a typical business owner's net worth is tied up in the business. It's the biggest asset most owners hold, and the one they've usually measured the least.<\u002Fp>\n          <p style=\"font-size:11px;color:#5d7186;border-top:1px solid #dde7f1;padding-top:9px;margin:0;\">Exit Planning Institute, 5-4-3-2-1 white paper. Figure is for business owners generally, not dentists specifically.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FINAL CTA -->\n  <div style=\"background:#092d4f;color:#fff;text-align:center;padding:76px 24px;\">\n    <div style=\"display:flex;justify-content:center;margin-bottom:22px;\">\n      <img src=\"efb6c098-584c-4658-8719-a97f4e902b3a\" alt=\"Jeremiah D. Barwick\" style=\"width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:top;border:3px solid #d5ecf6;\">\n      <img src=\"8a178f46-714b-4cca-ac9e-54577263ded9\" alt=\"Thomas Gore\" style=\"width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:top;border:3px solid #d5ecf6;margin-left:-14px;\">\n    <\u002Fdiv>\n    <h2 style=\"font-size:34px;line-height:1.2;font-weight:700;letter-spacing:-0.015em;color:#fff;margin:0 auto 16px;max-width:22ch;\">The number is being built right now<\u002Fh2>\n    <p style=\"opacity:0.85;font-size:17px;max-width:52ch;margin:0 auto 28px;\">Whether you're selling in three years or fifteen, what you'll be offered is being decided by how the practice runs this year. Two minutes will tell you where you stand.<\u002Fp>\n    <a href=\"#calc\" style=\"display:inline-block;border-radius:99px;padding:17px 34px;font-size:16px;font-weight:600;text-decoration:none;background:#d5ecf6;color:#092d4f;\">See your number<\u002Fa>\n  <\u002Fdiv>\n\n  <footer style=\"background:#061f38;color:rgba(255,255,255,0.55);padding:34px 24px;font-size:12px;line-height:1.7;\">\n    <div style=\"max-width:1080px;margin:0 auto;\">\n      Core Advisors, Ltd. is a registered investment advisor. The valuation calculator provides an estimate for educational purposes only and is not a formal valuation, an appraisal, or a promise of any outcome. Nothing on this page is investment, tax, or legal advice, and no specific result is guaranteed. Every practice's situation differs. Please visit coreadvisors.com for important disclosures.\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
