<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Posting</title>
<style>
  :root{--bg:#0d1017;--panel:#151a23;--panel2:#1b212c;--line:#232b38;--ink:#e8edf4;
    --dim:#8a96a8;--accent:#3872EB;--accent2:#7DA4F4;--warn:#d6a53c;--pos:#3fb37f;--neg:#e5686f;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
  .wrap{max-width:940px;margin:0 auto;padding:26px 20px 60px}
  h1{font-size:21px;margin:0 0 2px;font-weight:700}
  .sub{color:var(--dim);font-size:13px;margin-bottom:16px}
  .row1{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 15px}
  .card .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .card .v{font-size:22px;font-weight:700}
  .rerun{margin-left:auto;background:var(--accent);border:0;color:#fff;border-radius:9px;
    padding:8px 15px;font-size:14px;font-weight:600;cursor:pointer}
  .rerun:disabled{opacity:.6;cursor:default}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);margin:22px 0 10px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:rgba(229,104,111,.12);border:1px solid rgba(229,104,111,.35);color:#f2a6aa;
    border-radius:20px;padding:6px 13px;font-size:13px;font-weight:500}
  .tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:520px}
  th,td{text-align:right;padding:11px 15px;font-variant-numeric:tabular-nums}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line)}
  tbody tr{border-bottom:1px solid var(--line)}tbody tr:last-child{border-bottom:0}
  tbody tr:hover{background:var(--panel2)}
  .client{text-align:left;font-weight:600;color:var(--accent2)}
  .zero{color:var(--neg);font-weight:700}
  .ok{color:var(--pos)}
  .dim{color:var(--dim)}
</style></head>
<body><div class="wrap">
  <h1>Social Posting</h1>
  <div class="sub">Metricool · Facebook / LinkedIn / Instagram only (GBP ignored) · <span id="gen">loading…</span></div>
  <div class="row1">
    <div class="card"><div class="k">No posts (next 7d)</div><div class="v" id="c-gap">–</div></div>
    <div class="card"><div class="k">Awaiting approval</div><div class="v" id="c-ap">–</div></div>
    <div class="card"><div class="k">Clients covered</div><div class="v" id="c-ok">–</div></div>
    <button id="rerun" class="rerun" onclick="rerun()">⟳ Rerun</button>
  </div>
  <div id="gapwrap" style="display:none">
    <h2>⚠️ No FB / LI / IG posts scheduled — next 7 days</h2>
    <div class="chips" id="gaps"></div>
  </div>
  <h2>All clients</h2>
  <div class="tablewrap"><table>
    <thead><tr><th>Client</th><th>Scheduled (7d)</th><th>Awaiting approval</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</div>
<script>
let D={clients:[]};
function draw(){
  const c=D.clients||[];
  document.getElementById('gen').textContent=(D.error?('error: '+D.error):((D.generated||'')+' · LIVE · '+(D.window||'')));
  document.getElementById('c-gap').innerHTML='<span class="zero">'+(D.gaps||0)+'</span>';
  document.getElementById('c-ap').textContent=D.approvals||0;
  document.getElementById('c-ok').textContent=c.filter(x=>!x.gap).length;
  const gaps=c.filter(x=>x.gap);
  document.getElementById('gapwrap').style.display=gaps.length?'block':'none';
  document.getElementById('gaps').innerHTML=gaps.map(x=>`<span class="chip">${x.client}</span>`).join('');
  document.getElementById('rows').innerHTML=c.map(x=>`<tr>
    <td class="client">${x.client}</td>
    <td class="${x.scheduled?'ok':'zero'}">${x.scheduled}</td>
    <td class="${x.approvals?'':'dim'}">${x.approvals||'–'}</td></tr>`).join('');
}
async function rerun(){
  const btn=document.getElementById('rerun'); btn.disabled=true; btn.textContent='Refreshing…';
  try{ const r=await fetch('/api/social',{cache:'no-store'}); D=await r.json(); }
  catch(e){ D={clients:[],error:'portal service not running'}; }
  draw(); btn.disabled=false; btn.textContent='⟳ Rerun';
}
rerun();
</script>
