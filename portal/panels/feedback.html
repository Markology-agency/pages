<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Feedback</title>
<style>
  :root{--bg:#0d1017;--panel:#151a23;--panel2:#1b212c;--line:#232b38;--ink:#e8edf4;
    --dim:#8a96a8;--accent:#3872EB;--accent2:#7DA4F4;--warn:#d6a53c;--neg:#e5686f;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:26px 20px 60px}
  h1{font-size:21px;margin:0 0 2px;font-weight:700}
  .sub{color:var(--dim);font-size:13px;margin-bottom:16px}
  .row1{display:flex;gap:12px;align-items:center;margin-bottom:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 15px}
  .card .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .card .v{font-size:22px;font-weight:700}
  .rerun{margin-left:auto;background:var(--accent);border:0;color:#fff;border-radius:9px;
    padding:8px 15px;font-size:14px;font-weight:600;cursor:pointer}
  .rerun:disabled{opacity:.6;cursor:default}
  input{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:9px;
    padding:8px 12px;font-size:14px;min-width:170px;margin-left:8px}
  .tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:720px}
  th,td{text-align:left;padding:10px 15px;vertical-align:top}
  th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line)}
  tbody tr{border-bottom:1px solid var(--line)}tbody tr:last-child{border-bottom:0}
  tbody tr:hover{background:var(--panel2)}
  .client{color:var(--accent2);font-weight:600;white-space:nowrap}
  .task a{color:var(--ink);text-decoration:none}.task a:hover{color:var(--accent2)}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:rgba(214,165,60,.14);
    color:var(--warn);border:1px solid rgba(214,165,60,.35);white-space:nowrap}
  .mono{color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .empty{padding:26px;text-align:center;color:var(--dim)}
</style></head>
<body><div class="wrap">
  <h1>Client Feedback</h1>
  <div class="sub">Tasks clients sent back for changes (Edits Needed + Client Changes, last 10 days) · <span id="gen">loading…</span></div>
  <div class="row1">
    <div class="card"><div class="k">Open change-requests</div><div class="v" id="c-n">–</div></div>
    <div class="card"><div class="k">Clients</div><div class="v" id="c-c">–</div></div>
    <button id="rerun" class="rerun" onclick="rerun()">⟳ Rerun</button>
    <input id="q" placeholder="Filter…" oninput="draw()">
  </div>
  <div class="tablewrap"><table>
    <thead><tr><th>Client</th><th>What they asked for</th><th>Status</th><th>Owner</th><th>Updated</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</div>
<script>
let T=[];
function draw(){
  const q=(document.getElementById('q').value||'').toLowerCase().trim();
  const rows=T.filter(t=>!q||[t.client,t.name,t.status,t.owner].join(' ').toLowerCase().includes(q));
  document.getElementById('c-n').textContent=rows.length;
  document.getElementById('c-c').textContent=new Set(rows.map(r=>r.client).filter(c=>c!=='—')).size;
  const el=document.getElementById('rows');
  if(!rows.length){el.innerHTML='<tr><td colspan="5" class="empty">No open client change-requests. 🎉</td></tr>';return;}
  el.innerHTML=rows.map(t=>`<tr>
    <td class="client">${t.client}</td>
    <td class="task">${t.url?`<a href="${t.url}" target="_blank" rel="noopener">${t.name}</a>`:t.name}</td>
    <td><span class="pill">${t.status}</span></td>
    <td class="mono">${t.owner}</td>
    <td class="mono">${t.modified}</td></tr>`).join('');
}
async function rerun(){
  const b=document.getElementById('rerun'); b.disabled=true; b.textContent='Refreshing…';
  try{ const r=await fetch('/api/feedback',{cache:'no-store'}); const d=await r.json();
    if(d.error){document.getElementById('gen').textContent='error: '+d.error;}
    else{T=d.items||[];document.getElementById('gen').textContent=(d.generated||'')+' · LIVE';} }
  catch(e){ document.getElementById('gen').textContent='portal service not running'; }
  draw(); b.disabled=false; b.textContent='⟳ Rerun';
}
rerun();
</script>
