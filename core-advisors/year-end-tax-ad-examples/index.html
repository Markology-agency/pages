<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Year-End Tax Ad Examples</title>
<style>
@font-face{font-family:'Euclid Circular B';src:url('https://coreadvisors.com/wp-content/uploads/2024/12/Euclid-Circular-B-SemiBold.ttf') format('truetype');font-weight:600;font-display:swap}
:root{--navy:#092d4f;--green:#3a975b;--bg:#eef2f5;--ink:#1c1e21;--muted:#5f6368}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:36px 16px 32px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header .wrap{padding:0}
h1{font-family:'Euclid Circular B',sans-serif;font-weight:600;font-size:clamp(26px,4vw,36px);line-height:1.15}
header p{margin-top:8px;color:#cfe3f0;font-size:16px}
nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #dadde1}
nav .wrap{display:flex;gap:6px;padding:10px 16px}
nav a{text-decoration:none;color:var(--navy);font-weight:600;font-size:14px;padding:8px 14px;border-radius:999px;background:#d5ecf6}
h2{font-family:'Euclid Circular B',sans-serif;font-weight:600;font-size:26px;color:var(--navy);padding:40px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:28px}
.card{display:flex;flex-direction:column;gap:8px}
.label{font-size:13px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.05em}
.label span{display:block;font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);font-size:13px;margin-top:2px}
.card img{width:100%;height:auto;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.15);background:#fff}
.serp{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.15);padding:18px 20px;font-family:Arial,sans-serif}
.serp .sp{font-size:12px;font-weight:700;color:#202124;margin-bottom:8px}
.serp .dom{display:flex;gap:10px;align-items:center}
.serp .fav{width:26px;height:26px;border-radius:50%;background:#e8f0fe;flex:none}
.serp .n{font-size:14px;color:#202124}
.serp .u{font-size:12px;color:#4d5156}
.serp .t{color:#1a0dab;font-size:20px;line-height:1.3;margin:8px 0 4px}
.serp .d{color:#4d5156;font-size:14px;line-height:1.55}
.pb{padding-bottom:56px}
footer{padding:0 16px 40px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Year-End Tax Ads Running Now</h1>
  <p>What other firms are running on Meta and Google this fall, with the dental ones first.</p>
</div></header>
<nav><div class="wrap"><a href="#meta">Meta</a><a href="#google">Google</a></div></nav>
<main class="wrap pb">
  <h2 id="meta">Meta (Facebook and Instagram)</h2>
  <div class="grid" id="meta-grid"></div>
  <h2 id="google">Google search</h2>
  <div class="grid" id="google-grid"></div>
</main>
<footer>Meta ads are from the Meta Ad Library, active in the US on Nov 5, 2026. Google ads are from SEMrush's US ad history.</footer>
<script>
const META = [
  ["empire","Empire Tax Advisors","Dental · Video · Tax strategy call"],
  ["clarivis","Clarivis Tax","Dental · Dec 31 deadline · Book a planning call"],
  ["pgep","Pastor Golbois Ebert & Palladino CPAs","Dental · Free 12-page playbook"],
  ["squires","Squires Tax Planning","Doctors and dentists · Dec 31 deadline"],
  ["maxreturn","Maxreturn","Dentists and medical · Video · \"You can't extend December 31\""],
  ["matts-advisory","Matt's Advisory","Doctors · Video · Book now"],
  ["massey","Massey & Company CPA","Small business · Carousel · Free consultation"],
  ["cycle-cpa","Cycle CPA","Landscapers · Free year-end webinar"]
];
const GOOGLE = [
  {n:"R. Osman CPA",u:"https://www.rosman-cpa.com",img:"google-rosman",l:"Dental · search: tax planning for dentists · live Nov 5"},
  {n:"TurboTax",u:"https://turbotax.intuit.com › official-site › tax-deductions",t:"Tax Deduction Checklist - Understand Your Tax Deductions",d:"We’ll Find Every Tax Break To Keep More Money In Your Business - Guaranteed.",l:"Guarantee · search: year end tax planning · Mar 2026"},
  {n:"Edelman Financial Engines",u:"https://www.edelmanfinancialengines.com",t:"Proactive Tax Planning | Let's talk tax planning—free",d:"Smart tax planning helps keep more money in your pocket. A smart investment tax plan helps you keep more of your money and avoid costly surprises. For Families With $250k+ Financial Planning. Retirement Planning. Virtual Appointments.",l:"Free planning talk · search: tax planning services · Jun 2026"},
  {n:"Edelman Financial Engines",u:"https://www.edelmanfinancialengines.com",t:"2026 tax planning starts now | Missing out on tax savings?",d:"See how new tax laws affect your financial plan. Connect with a planner. Wealth...",l:"Question hook · search: year end tax planning · Mar 2026"},
  {n:"My CPA Coach",u:"https://www.mycpacoach.com",t:"Strategic Tax Planning",d:"Proactive Tax Planning — Strategic tax planning for business owners. CPA-led team. Book a free tax assessment. Personalized tax strategies for S-Corps, LLCs, and self-employed. Year-round support.",l:"Free tax assessment · search: tax planning services · Jul 2026"},
  {n:"Franklin Madison Tax Solutions",u:"https://www.franklinmadisontaxsolutions.net",t:"Tech Tax Planning | Flat-Fee Tax Planning | Free Strategy Session",d:"Reduce taxes tied to RSUs, stock options, and equity income. Specialized planning for high-income tech professionals. High Earner Strategies. ESPP Tax Strategies. Virtual Tax Planning.",l:"Niche + free session · search: year end tax planning · Jul 2026"},
  {n:"Baker Tilly",u:"https://www.bakertilly.com",t:"Year-End Tax Planning - Tax Planning",d:"Check out the recordings of our engaging year-end tax planning webinar series.",l:"Webinar · search: year end tax planning · Mar 2026"}
];
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
document.getElementById("meta-grid").innerHTML=META.map(([f,n,l])=>`<div class="card"><div class="label">${esc(n)}<span>${esc(l)}</span></div><img src="img/meta-${f}.jpg" alt="${esc(n)} Meta ad" loading="lazy"></div>`).join("");
document.getElementById("google-grid").innerHTML=GOOGLE.map(g=>`<div class="card"><div class="label">${esc(g.n)}<span>${esc(g.l)}</span></div>${g.img?`<img src="img/${g.img}.jpg" alt="${esc(g.n)} Google ad" loading="lazy">`:`<div class="serp"><div class="sp">Sponsored</div><div class="dom"><div class="fav"></div><div><div class="n">${esc(g.n)}</div><div class="u">${esc(g.u)}</div></div></div><div class="t">${esc(g.t)}</div><div class="d">${esc(g.d)}</div></div>`}</div>`).join("");
</script>
</body>
</html>
