<style>
  :root {
    --bg: #0b0b0b;
    --panel: #121212;
    --ink: #f4f4f4;
    --muted: #a8a8a8;
    --brand: #9CCC2D;
    --brand-ink: #0b0b0b;
    --border: rgba(255,255,255,0.08);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--ink);
  }
  .brand-mark {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--brand);
    display: grid;
    place-items: center;
    color: var(--brand-ink);
    font-weight: 800;
    font-size: 18px;
    line-height: 1;
  }
  .brand-text { font-weight: 700; font-size: 14px; letter-spacing: 0.2px; }
  .brand-sub { color: var(--muted); font-size: 12px; margin-left: 2px; }

  .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

  .btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--ink);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s ease, transform 0.05s ease, border-color 0.15s ease;
    text-decoration: none;
  }
  .btn:hover { background: #1c1c1c; border-color: rgba(255,255,255,0.16); }
  .btn:active { transform: translateY(1px); }
  .btn-primary {
    background: var(--brand);
    color: var(--brand-ink);
    border-color: var(--brand);
  }
  .btn-primary:hover { background: #b1e23a; border-color: #b1e23a; }
  .btn svg { width: 14px; height: 14px; }

  /* ---------- Stage ---------- */
  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    position: relative;
  }

  .book-wrap {
    position: relative;
    width: 100%;
    max-width: 1120px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #book {
    margin: 0 auto;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.8), 0 12px 24px -10px rgba(0,0,0,0.6);
    background: #000;
  }

  /* StPageFlip injects pages with class .page; this targets the rendered images */
  .page-image {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
  }

  /* Nav arrows */
  .nav-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(20,20,20,0.85);
    border: 1px solid var(--border);
    color: var(--ink);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background 0.15s ease;
    z-index: 5;
  }
  .nav-arrow:hover { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .nav-arrow svg { width: 18px; height: 18px; }
  .nav-prev { left: -8px; }
  .nav-next { right: -8px; }
  @media (min-width: 1180px) {
    .nav-prev { left: -56px; }
    .nav-next { right: -56px; }
  }

  /* ---------- Footer controls ---------- */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 14px 20px 22px;
    border-top: 1px solid var(--border);
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    flex-wrap: wrap;
  }
  .page-counter {
    color: var(--muted);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    min-width: 80px;
    text-align: center;
  }
  .page-counter strong { color: var(--ink); font-weight: 600; }

  .hint {
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    padding: 0 20px 14px;
  }
  .hint kbd {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 4px;
    background: #1c1c1c;
    border: 1px solid var(--border);
    color: var(--ink);
    font-size: 11px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    margin: 0 2px;
  }

  /* ---------- Print ---------- */
  #print-area { display: none; }

  @media print {
    @page { size: auto; margin: 0; }
    html, body { background: #fff; }
    .topbar, .controls, .hint, .stage, .nav-arrow { display: none !important; }
    #print-area { display: block; }
    #print-area img {
      display: block;
      width: 100%;
      page-break-after: always;
      break-after: page;
    }
    #print-area img:last-child { page-break-after: auto; break-after: auto; }
  }

  /* ---------- Small screens ---------- */
  @media (max-width: 640px) {
    .topbar { padding: 10px 12px; gap: 8px; }
    .brand-text { font-size: 13px; }
    .brand-sub { display: none; }
    .btn { padding: 7px 10px; font-size: 12px; }
    .btn-label-long { display: none; }
    .stage { padding: 12px 8px; }
    .nav-prev { left: 4px; }
    .nav-next { right: 4px; }
  }
</style>

<body>

  <div class="actions">

      <span class="btn-label-long">Download PDF</span>

<main class="stage">
  <div class="book-wrap">
    <button class="nav-arrow nav-prev" id="prev" aria-label="Previous page">

  <img src="pages/page-12.jpg" alt="Page 12" />
  <img src="pages/page-13.jpg" alt="Page 13" />
  <img src="pages/page-14.jpg" alt="Page 14" />
  <img src="pages/page-15.jpg" alt="Page 15" />
  <img src="pages/page-16.jpg" alt="Page 16" />

  <img src="pages/page-18.jpg" alt="Page 18" />

<script>
(function () {
  const TOTAL = 18;
  const ASPECT = 1241 / 1755; // width / height of source pages
  const bookEl = document.getElementById('book');
  const counter = document.getElementById('page-current');
  const totalEl = document.getElementById('page-total');
  totalEl.textContent = TOTAL;

  function pageSize() {
    // Single page on narrow viewports, two-page spread otherwise.
    const isPortrait = window.innerWidth < 900;
    const topbar = 56;
    const controls = 80;
    const hint = 28;
    const padding = 48;
    const reserved = topbar + controls + hint + padding;
    const availH = Math.max(420, window.innerHeight - reserved);

    let h = Math.min(availH, 1100);
    let singleW = Math.round(h * ASPECT);

    // Make sure the spread fits horizontally.
    const maxStageW = Math.min(window.innerWidth - 32, 1120);
    if (!isPortrait) {
      const spreadW = singleW * 2;
      if (spreadW > maxStageW) {
        singleW = Math.floor(maxStageW / 2);
        h = Math.round(singleW / ASPECT);
      }
    } else {
      if (singleW > maxStageW) {
        singleW = maxStageW;
        h = Math.round(singleW / ASPECT);
      }
    }
    return { width: singleW, height: h, portrait: isPortrait };
  }

  let pageFlip;

  function buildPages() {
    const pages = [];
    for (let i = 1; i <= TOTAL; i++) {
      const n = String(i).padStart(2, '0');
      pages.push(
        '<div class="page"><img class="page-image" src="pages/page-' + n + '.jpg" alt="Page ' + i + '" loading="' + (i <= 4 ? 'eager' : 'lazy') + '" /></div>'
      );
    }
    return pages;
  }

  function init() {
    const { width, height, portrait } = pageSize();
    bookEl.innerHTML = buildPages().join('');

    pageFlip = new St.PageFlip(bookEl, {
      width: width,
      height: height,
      size: 'fixed',
      minWidth: 240,
      maxWidth: 900,
      minHeight: 340,
      maxHeight: 1300,
      drawShadow: true,
      maxShadowOpacity: 0.4,
      showCover: true,
      mobileScrollSupport: true,
      usePortrait: portrait,
      flippingTime: 700,
      useMouseEvents: true,
      swipeDistance: 30,
      clickEventForward: false,
    });

    pageFlip.loadFromHTML(document.querySelectorAll('#book .page'));

    pageFlip.on('flip', (e) => {
      // e.data is the page index of the LEFT page in spread (0-based)
      const idx = e.data;
      // In landscape spread, show current visible page numbers
      let display;
      if (portrait) {
        display = (idx + 1) + '';
      } else {
        if (idx === 0) display = '1';
        else if (idx >= TOTAL - 1) display = TOTAL + '';
        else display = (idx + 1) + '–' + (idx + 2);
      }
      counter.textContent = display;
    });
  }

  init();

  // Re-init on significant viewport changes (orientation, large resize)
  let resizeTimer;
  let lastW = window.innerWidth, lastH = window.innerHeight;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const dw = Math.abs(window.innerWidth - lastW);
      const dh = Math.abs(window.innerHeight - lastH);
      if (dw > 80 || dh > 120) {
        lastW = window.innerWidth;
        lastH = window.innerHeight;
        try { pageFlip.destroy(); } catch (e) {}
        init();
      }
    }, 250);
  });

  // Buttons
  document.getElementById('next').addEventListener('click', () => pageFlip.flipNext());
  document.getElementById('prev').addEventListener('click', () => pageFlip.flipPrev());
  document.getElementById('next-2').addEventListener('click', () => pageFlip.flipNext());
  document.getElementById('prev-2').addEventListener('click', () => pageFlip.flipPrev());

  document.addEventListener('keydown', (e) => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (e.key === 'ArrowRight') { pageFlip.flipNext(); e.preventDefault(); }
    if (e.key === 'ArrowLeft')  { pageFlip.flipPrev(); e.preventDefault(); }
  });

  document.getElementById('btn-print').addEventListener('click', () => {
    window.print();
  });

  const fsBtn = document.getElementById('btn-fullscreen');
  fsBtn.addEventListener('click', () => {
    const el = document.documentElement;
    if (!document.fullscreenElement) {
      (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document);
    }
  });
})();
</script>
