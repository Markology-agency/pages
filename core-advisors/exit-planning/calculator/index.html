document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"7a386ab9-9f83-4a34-9d3b-4beb904858ed\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <style>\n    @font-face{font-family:'Euclid Circular B';src:url(\"7ed66474-4dce-40e2-9725-0f3eec394e42\") format('truetype');font-weight:400;font-display:swap}\n    @font-face{font-family:'Euclid Circular B';src:url(\"d8e71a6b-59d2-4012-b3b6-b9ffad25045e\") format('truetype');font-weight:500;font-display:swap}\n    @font-face{font-family:'Euclid Circular B';src:url(\"b7ce618d-ddc0-4ccd-8610-3ef4030d3da6\") format('truetype');font-weight:600;font-display:swap}\n    @font-face{font-family:'Euclid Circular B';src:url(\"a9b53b9d-edb1-46e0-988b-69e04edb19e0\") format('truetype');font-weight:700;font-display:swap}\n    body{margin:0;-webkit-font-smoothing:antialiased}\n    a{color:#092d4f}a:hover{color:#123f68}\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"font-family:'Euclid Circular B','Poppins',system-ui,sans-serif;color:#092d4f;line-height:1.5;max-width:860px;margin:0 auto;padding:8px;\">\n  <div style=\"background:#fff;border-radius:16px;box-shadow:0 6px 32px rgba(9,45,79,0.08);overflow:hidden;\">\n    <sc-if value=\"{{ notDone }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"padding:22px 32px 0;\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#5d7186;margin-bottom:10px;\">\n          <span style=\"font-weight:600;color:#092d4f;letter-spacing:0.02em;\">{{ partName }}<\u002Fspan>\n          <span>{{ stepLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"height:6px;background:#e6eef6;border-radius:99px;overflow:hidden;\">\n          <div style=\"{{ fillStyle }}\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:30px 32px 34px;\">\n        <p style=\"font-size:23px;font-weight:600;margin:0 0 8px;line-height:1.3;\">{{ q }}<\u002Fp>\n        <p style=\"font-size:14px;color:#5d7186;margin:0 0 20px;max-width:60ch;\">{{ help }}<\u002Fp>\n        <sc-if value=\"{{ isMoney }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;align-items:stretch;border:2px solid #092d4f;border-radius:10px;overflow:hidden;max-width:420px;\">\n            <span style=\"background:#eef3f8;padding:14px 18px;font-weight:600;color:#5d7186;display:flex;align-items:center;\">$<\u002Fspan>\n            <input type=\"text\" inputmode=\"numeric\" value=\"{{ moneyValue }}\" sc-camel-on-change=\"{{ onMoney }}\" placeholder=\"{{ ph }}\" style=\"border:0;outline:0;padding:14px 16px;font-size:17px;width:100%;font-family:inherit;color:#092d4f;\">\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasSuffix }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"font-size:13px;color:#5d7186;margin-top:8px;\">{{ suffix }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isOpts }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;gap:10px;max-width:560px;\">\n            <sc-for list=\"{{ options }}\" as=\"o\" hint-placeholder-count=\"4\">\n              <div sc-camel-on-click=\"{{ o.onClick }}\" style=\"{{ o.style }}\" style-hover=\"border-color:#9db8d0;background:#f8fbfe;\">\n                <span style=\"{{ o.radioStyle }}\"><span style=\"{{ o.dotStyle }}\"><\u002Fspan><\u002Fspan>\n                <span>{{ o.label }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isGate }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"max-width:420px;margin-bottom:16px;\">\n            <label style=\"display:block;font-size:14px;font-weight:500;margin-bottom:7px;\">Your name<\u002Flabel>\n            <input type=\"text\" value=\"{{ nameVal }}\" sc-camel-on-change=\"{{ onName }}\" placeholder=\"Dr. Jane Smith\" style=\"width:100%;box-sizing:border-box;border:2px solid #092d4f;border-radius:10px;padding:13px 15px;font-size:16px;font-family:inherit;outline:0;color:#092d4f;\">\n          <\u002Fdiv>\n          <div style=\"max-width:420px;margin-bottom:16px;\">\n            <label style=\"display:block;font-size:14px;font-weight:500;margin-bottom:7px;\">Your practice email<\u002Flabel>\n            <input type=\"email\" value=\"{{ emailVal }}\" sc-camel-on-change=\"{{ onEmail }}\" placeholder=\"jane@yourpractice.com\" style=\"width:100%;box-sizing:border-box;border:2px solid #092d4f;border-radius:10px;padding:13px 15px;font-size:16px;font-family:inherit;outline:0;color:#092d4f;\">\n          <\u002Fdiv>\n          <p style=\"font-size:12px;color:#5d7186;max-width:52ch;margin-top:4px;\">We use this to send your valuation and follow up once. No lists, and we don't sell your details on.<\u002Fp>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ errVisible }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"color:#c0392b;font-size:13px;margin-top:10px;\">{{ errMsg }}<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;align-items:center;background:#092d4f;padding:16px 32px;\">\n        <button sc-camel-on-click=\"{{ onPrev }}\" disabled=\"{{ prevDisabled }}\" style=\"{{ prevStyle }}\">Back<\u002Fbutton>\n        <span style=\"color:#fff;font-size:13px;opacity:0.85;font-weight:500;\">{{ counterText }}<\u002Fspan>\n        <button sc-camel-on-click=\"{{ onNext }}\" style=\"font-family:inherit;font-size:15px;border-radius:99px;padding:11px 24px;cursor:pointer;border:1px solid #fff;background:#fff;color:#092d4f;font-weight:600;\">{{ nextLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ done }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:linear-gradient(135deg,#092d4f,#123f68);color:#fff;padding:34px 32px;\">\n        <p style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;opacity:0.75;margin:0 0 9px;\">Your practice valuation<\u002Fp>\n        <h1 style=\"margin:0 0 6px;font-size:28px;line-height:1.25;font-weight:700;\">Here's your number, and the one you're leaving on the table.<\u002Fh1>\n        <p style=\"margin:0;opacity:0.85;font-size:15px;max-width:62ch;\">What your practice is worth today, what a best-in-class version of the same practice is worth, and what's causing the difference.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:32px;\">\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;\">\n          <div style=\"border:1px solid #dde7f1;border-radius:12px;padding:20px;background:#f7fafd;\">\n            <p style=\"font-size:13px;color:#5d7186;margin:0 0 8px;font-weight:500;\">Your estimated value today<\u002Fp>\n            <p style=\"font-size:30px;font-weight:700;margin:0 0 4px;letter-spacing:-0.01em;\">{{ valTodayText }}<\u002Fp>\n            <p style=\"font-size:12px;color:#5d7186;margin:0;\">{{ sdeNote }}<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #cfe8d8;border-radius:12px;padding:20px;background:#f4faf6;\">\n            <p style=\"font-size:13px;color:#5d7186;margin:0 0 8px;font-weight:500;\">Best-in-class potential<\u002Fp>\n            <p style=\"font-size:30px;font-weight:700;margin:0 0 4px;letter-spacing:-0.01em;color:#3a975b;\">{{ valBicText }}<\u002Fp>\n            <p style=\"font-size:12px;color:#5d7186;margin:0;\">Same collections. Same chairs. Different structure.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:18px;background:#f2f7fc;border:1px solid #dde7f1;border-radius:10px;padding:14px 16px;font-size:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;\">\n          <span>Your seller's discretionary earnings<\u002Fspan>\n          <span><b style=\"font-weight:700;\">{{ sdeVal }}<\u002Fb> <span style=\"color:#5d7186;\">(computed from your five inputs)<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin-top:28px;\">\n          <p style=\"font-size:15px;font-weight:600;margin:0 0 12px;\">The gap<\u002Fp>\n          <div style=\"position:relative;height:42px;background:#eaf1f8;border-radius:8px;overflow:hidden;\">\n            <div style=\"{{ barTodayStyle }}\"><\u002Fdiv>\n            <div style=\"{{ barGapStyle }}\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;margin-top:9px;font-size:12px;color:#5d7186;\"><span>Value today<\u002Fspan><span>Best-in-class potential<\u002Fspan><\u002Fdiv>\n          <div style=\"margin-top:16px;background:#fdf7ec;border:1px solid #f0dcb4;border-radius:12px;padding:15px 17px;font-size:15px;\">\n            <sc-if value=\"{{ isBic }}\" hint-placeholder-val=\"{{ false }}\">\n              Your practice already carries most of what a buyer pays a premium for. The remaining gap is <b style=\"color:#c98a1e;\">{{ gapText }}<\u002Fb>, and it's a refinement rather than a rebuild.\n            <\u002Fsc-if>\n            <sc-if value=\"{{ notBic }}\" hint-placeholder-val=\"{{ true }}\">\n              You're leaving roughly <b style=\"color:#c98a1e;\">{{ gapText }}<\u002Fb> on the table. That gap isn't dentistry. It's structure, and it's the part you can actually change.\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:30px;border:1px solid #dde7f1;border-radius:12px;padding:20px;background:#f7fafd;\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;\">\n            <h2 style=\"margin:0;font-size:16px;font-weight:600;\">Your transferability score <span style=\"{{ tierStyle }}\">{{ tierText }}<\u002Fspan><\u002Fh2>\n            <span style=\"font-size:26px;font-weight:700;\">{{ pctText }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:10px;background:#e2ebf4;border-radius:99px;position:relative;\">\n            <div style=\"{{ sfillStyle }}\"><\u002Fdiv>\n            <div style=\"position:absolute;left:72%;top:-5px;bottom:-5px;width:2px;background:#3a975b;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;margin-top:9px;font-size:12px;color:#5d7186;\"><span>Discounted<\u002Fspan><span>Above average<\u002Fspan><span>Best-in-class (72%)<\u002Fspan><\u002Fdiv>\n          <p style=\"margin:13px 0 0;font-size:13px;color:#5d7186;\">Modeled on the Exit Planning Institute's Attractiveness Index, adapted for dental practices. Above 72% is best-in-class.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"margin-top:30px;\">\n          <h2 style=\"font-size:17px;margin:0 0 5px;font-weight:600;\">{{ driversTitle }}<\u002Fh2>\n          <p style=\"font-size:13px;color:#5d7186;margin:0 0 14px;\">{{ driversSub }}<\u002Fp>\n          <sc-for list=\"{{ drivers }}\" as=\"d\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;gap:13px;align-items:flex-start;padding:15px 0;border-top:1px solid #dde7f1;\">\n              <div style=\"{{ d.dotStyle }}\"><\u002Fdiv>\n              <div>\n                <h3 style=\"margin:0 0 4px;font-size:15px;font-weight:600;\">{{ d.t }}<\u002Fh3>\n                <p style=\"margin:0;font-size:14px;color:#5d7186;\">{{ d.p }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:30px;background:#092d4f;border-radius:14px;padding:28px 30px;color:#fff;display:flex;gap:22px;align-items:center;justify-content:space-between;flex-wrap:wrap;\">\n          <div style=\"min-width:280px;flex:1;\">\n            <h2 style=\"margin:0 0 6px;font-size:20px;font-weight:700;\">Want the real number?<\u002Fh2>\n            <p style=\"margin:0;opacity:0.85;font-size:14px;max-width:46ch;\">This is an estimate from a handful of inputs. A proper valuation looks at your actual books, and the conversation about closing the gap is the one worth having.<\u002Fp>\n            <div style=\"display:flex;gap:9px;margin-top:14px;flex-wrap:wrap;\">\n              <span style=\"background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);border-radius:6px;padding:5px 9px;font-size:11px;letter-spacing:0.04em;\">CEPA® CERTIFIED EXIT PLANNING ADVISOR<\u002Fspan>\n              <span style=\"background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);border-radius:6px;padding:5px 9px;font-size:11px;letter-spacing:0.04em;\">EXIT PLANNING INSTITUTE<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <button style=\"background:#fff;color:#092d4f;border:0;border-radius:99px;padding:14px 26px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;\">{{ ctaLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"margin-top:18px;text-align:center;\">\n          <button sc-camel-on-click=\"{{ onRestart }}\" style=\"background:none;border:0;color:#5d7186;font-size:13px;text-decoration:underline;cursor:pointer;font-family:inherit;\">Start over<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"margin-top:20px;font-size:12px;color:#5d7186;line-height:1.6;\">This calculator provides an estimate for educational purposes only. It is not a formal valuation, an appraisal, or a promise of any sale price or outcome. Actual practice value depends on many factors this tool does not capture. Core Advisors, Ltd. is a registered investment advisor. Please visit coreadvisors.com for important disclosures.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:880,&quot;height&quot;:780},&quot;emailGate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;advisorName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Jeremiah&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Copy&quot;}}\">\nclass Component extends DCLogic {\n  state = { i: 0, vals: {}, scores: {}, name: '', email: '', err: false, done: false };\n  renderVals() {\n    const gate = this.props.emailGate ?? true;\n    const advisor = this.props.advisorName ?? 'Jeremiah';\n    const MONEY = [\n      { id: 'collections', q: 'What are your gross collections?', help: 'Your annual revenue, before any expenses.', ph: '1,200,000', suffix: '' },\n      { id: 'ownerComp', q: \"What is the owner's compensation?\", help: 'Salary, bonuses, anything you take from the practice. We add this back, because a buyer would set their own.', ph: '250,000', suffix: 'Per year' },\n      { id: 'staff', q: 'Monthly staff overhead costs', help: 'Everyone but you. Wages, payroll taxes, benefits.', ph: '35,000', suffix: 'Per month' },\n      { id: 'opex', q: 'Monthly operating expenses', help: 'Everything else it takes to run the place: rent, supplies, lab, software, insurance.', ph: '18,000', suffix: 'Per month' },\n      { id: 'personal', q: 'Any personal expenses run through the practice?', help: \"Car payments, travel, meals. These get added back too, because they aren't really costs of running the practice.\", ph: '24,000', suffix: 'Per year. Enter 0 if none.' }\n    ];\n    const OPTS = [\n      { key: 'q6', q: 'If you stepped away for a month, what happens to production?', help: 'This is the single biggest driver of what a buyer will pay.', opts: [[3, 'It runs normally. The team and associates carry it.'], [2, 'It dips a little, but holds up.'], [1, 'It drops noticeably.'], [0, 'It basically stops.']] },\n      { key: 'q7', q: 'Are your core systems written down?', help: 'Scheduling, hygiene recall, case presentation, billing, collections.', opts: [[3, 'All documented, and the team follows them.'], [2, 'Mostly documented.'], [1, 'A few are.'], [0, \"It lives in my head, or one long-time team member's head.\"]] },\n      { key: 'q8', q: 'Who do your patients feel they belong to?', help: 'A buyer is asking whether the patients stay once you leave.', opts: [[3, 'The practice and the whole care team.'], [2, 'A mix of me and the team.'], [1, 'Mostly me.'], [0, 'Almost entirely me.']] },\n      { key: 'q9', q: 'Do you have a leadership bench?', help: 'An office manager, a lead hygienist, a lead assistant. People who can decide things without you.', opts: [[3, \"Yes, and decisions don't bottleneck at me.\"], [2, 'Partly. Some still route to me.'], [1, \"One person, and they're stretched.\"], [0, 'Everything routes to me.']] },\n      { key: 'q10', q: 'Do you track your numbers and act on them?', help: 'Production, collections, hygiene %, case acceptance, chair utilization.', opts: [[3, 'Monthly, and we change things based on what we see.'], [2, 'We track them, but rarely act.'], [1, 'We look at some, sometimes.'], [0, 'Not really.']] }\n    ];\n    const steps = [\n      ...MONEY.map(m => ({ type: 'money', part: 'The numbers', ...m })),\n      ...OPTS.map(o => ({ type: 'opts', part: 'What makes it transferable', ...o }))\n    ];\n    if (gate) steps.push({ type: 'gate', part: 'Your result', q: 'Where should we send your valuation?', help: \"We'll email you a copy so you have it, along with the breakdown of what's driving your number.\" });\n    const n = steps.length, i = Math.min(this.state.i, n - 1), s = steps[i];\n    const digits = v => (v || '').replace(/[^\\d]/g, '');\n    const fmt = v => { const d = digits(v); return d ? Number(d).toLocaleString('en-US') : ''; };\n    const valid = () => {\n      if (s.type === 'money') return digits(this.state.vals[s.id]) !== '';\n      if (s.type === 'opts') return this.state.scores[s.key] !== undefined;\n      return this.state.name.trim().length > 1 && /^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(this.state.email.trim());\n    };\n    const num = id => Number(digits(this.state.vals[id])) || 0;\n    const sde = num('collections') - num('staff') * 12 - num('opex') * 12 + num('personal');\n    const keys = ['q6', 'q7', 'q8', 'q9', 'q10'];\n    const pct = Math.round(keys.reduce((a, k) => a + (this.state.scores[k] || 0), 0) / 15 * 100);\n    let tierText, tierBg, tierCol;\n    if (pct > 72) { tierText = 'Best-in-class'; tierBg = '#e8f5ed'; tierCol = '#1f6b3b'; }\n    else if (pct >= 58) { tierText = 'Above average'; tierBg = '#fdf3e3'; tierCol = '#8a5f14'; }\n    else if (pct <= 50) { tierText = 'Discounted'; tierBg = '#fdeaea'; tierCol = '#9b2c2c'; }\n    else { tierText = 'Middle of the pack'; tierBg = '#fdf3e3'; tierCol = '#8a5f14'; }\n    const MULT_FLOOR = 1.0, MULT_CEILING = 2.0; const multToday = MULT_FLOOR + (pct \u002F 100) * (MULT_CEILING - MULT_FLOOR); const valToday = Math.round(sde * multToday); const valBic = Math.round(sde * MULT_CEILING); const gapAmt = Math.max(0, valBic - valToday); const money = x => '$' + Math.round(x).toLocaleString('en-US'); const w = valBic > 0 ? Math.max(8, Math.round(valToday \u002F valBic * 100)) : 8;\n    const driverCopy = {\n      q6: { t: 'The practice depends on you being in the building', p: \"Production drops when you step away. Buyers discount what they can't transfer, because they'd be buying a job rather than an asset.\" },\n      q7: { t: \"Your systems live in someone's head\", p: \"Scheduling, hygiene recall, case presentation, billing. Undocumented process is value a buyer can't verify or take over.\" },\n      q8: { t: 'Patients belong to you, not the practice', p: \"When the relationship is with the owner-doctor rather than the team and the brand, it doesn't survive the sale, and the multiple reflects that.\" },\n      q9: { t: 'Decisions bottleneck at you', p: \"Without a leadership bench, a buyer isn't acquiring a management team. They're acquiring your calendar.\" },\n      q10: { t: \"Your numbers aren't driving decisions\", p: \"When KPIs aren't tracked and acted on, problems surface late, and a buyer sees risk they can't price.\" }\n    };\n    const weak = keys.map(k => ({ k, v: this.state.scores[k] || 0 })).filter(x => x.v < 3).sort((a, b) => a.v - b.v).slice(0, 3);\n    const amberDot = { flex: '0 0 8px', height: 8, borderRadius: '50%', marginTop: 8, background: '#c98a1e' };\n    const drivers = weak.length ? weak.map(x => ({ ...driverCopy[x.k], dotStyle: amberDot }))\n      : [{ t: 'Your practice is genuinely transferable', p: \"You scored at the top of every driver we asked about. That's rare, and it's exactly what earns the higher end of the range. The conversation worth having now is about timing and options, not repairs.\", dotStyle: { ...amberDot, background: '#3a975b' } }];\n    return {\n      notDone: !this.state.done, done: this.state.done,\n      partName: s.part, stepLabel: 'Step ' + (i + 1) + ' of ' + n, counterText: (i + 1) + ' of ' + n,\n      fillStyle: { height: '100%', width: (i / n * 100) + '%', background: '#092d4f', borderRadius: 99, transition: 'width .35s ease' },\n      q: s.q, help: s.help,\n      isMoney: s.type === 'money', isOpts: s.type === 'opts', isGate: s.type === 'gate',\n      ph: s.ph || '', suffix: s.suffix || '', hasSuffix: !!s.suffix,\n      moneyValue: s.type === 'money' ? fmt(this.state.vals[s.id]) : '',\n      onMoney: e => this.setState(st => ({ vals: { ...st.vals, [s.id]: e.target.value }, err: false })),\n      options: s.type === 'opts' ? s.opts.map(([v, label]) => {\n        const sel = this.state.scores[s.key] === v;\n        return {\n          label,\n          onClick: () => this.setState(st => ({ scores: { ...st.scores, [s.key]: v }, err: false })),\n          style: { display: 'flex', alignItems: 'center', gap: 13, border: sel ? '1.5px solid #092d4f' : '1.5px solid #dde7f1', borderRadius: 10, padding: '14px 16px', cursor: 'pointer', fontSize: 15, transition: '.15s', background: sel ? '#f2f7fc' : '#fff' },\n          radioStyle: { flex: '0 0 18px', height: 18, borderRadius: '50%', border: sel ? '2px solid #092d4f' : '2px solid #b9cbdc', position: 'relative', boxSizing: 'border-box' },\n          dotStyle: { position: 'absolute', inset: 3, borderRadius: '50%', background: sel ? '#092d4f' : 'transparent' }\n        };\n      }) : [],\n      nameVal: this.state.name, emailVal: this.state.email,\n      onName: e => this.setState({ name: e.target.value, err: false }),\n      onEmail: e => this.setState({ email: e.target.value, err: false }),\n      errVisible: this.state.err,\n      errMsg: s.type === 'money' ? 'Enter a number to continue.' : s.type === 'opts' ? 'Pick one to continue.' : 'Add your name and a valid email to continue.',\n      prevDisabled: i === 0,\n      prevStyle: { fontFamily: 'inherit', fontSize: 15, borderRadius: 99, padding: '11px 24px', cursor: i === 0 ? 'not-allowed' : 'pointer', border: '1px solid rgba(255,255,255,.4)', background: 'transparent', color: '#fff', fontWeight: 500, opacity: i === 0 ? 0.35 : 1 },\n      onPrev: () => { if (this.state.i > 0) this.setState({ i: this.state.i - 1, err: false }); },\n      nextLabel: i === n - 1 ? 'Get my valuation' : 'Next',\n      onNext: () => { if (!valid()) { this.setState({ err: true }); return; } if (i === n - 1) this.setState({ done: true, err: false }); else this.setState({ i: i + 1, err: false }); },\n      sdeVal: '$' + Math.round(sde).toLocaleString('en-US'),\n      valTodayText: money(valToday), valBicText: money(valBic), gapText: money(gapAmt),\n      sdeNote: 'Based on discretionary earnings of $' + Math.round(sde).toLocaleString('en-US'),\n      pctText: pct + '%',\n      tierText, tierStyle: { display: 'inline-block', borderRadius: 6, padding: '3px 9px', fontSize: 12, fontWeight: 600, marginLeft: 8, background: tierBg, color: tierCol },\n      barTodayStyle: { position: 'absolute', left: 0, top: 0, bottom: 0, width: w + '%', background: '#092d4f', borderRadius: '8px 0 0 8px', transition: 'width .6s ease' },\n      barGapStyle: { position: 'absolute', top: 0, bottom: 0, left: w + '%', right: 0, background: 'repeating-linear-gradient(45deg,#f6e7c8,#f6e7c8 8px,#fbf2e0 8px,#fbf2e0 16px)' },\n      sfillStyle: { position: 'absolute', left: 0, top: 0, bottom: 0, width: pct + '%', background: '#092d4f', borderRadius: 99, transition: 'width .6s ease' },\n      isBic: pct > 72, notBic: pct <= 72,\n      driversTitle: weak.length ? \"What's holding your number down\" : 'What you have already built',\n      driversSub: weak.length ? 'Your biggest gaps, based on your answers.' : '',\n      drivers,\n      ctaLabel: 'Book a call with ' + advisor,\n      onRestart: () => this.setState({ i: 0, vals: {}, scores: {}, name: '', email: '', err: false, done: false })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
