<style>
  :root{--bg:#0d1017;--panel:#151a23;--panel2:#1b212c;--line:#232b38;--ink:#e8edf4;
    --dim:#8a96a8;--accent:#3872EB;--accent2:#7DA4F4;--warn:#d6a53c;--pos:#3fb37f;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:26px 20px 60px}
  h1{font-size:21px;margin:0 0 2px;font-weight:700}
  .sub{color:var(--dim);font-size:13px;margin-bottom:16px}
  .row1{display:flex;gap:12px;align-items:center;margin-bottom:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 15px}
  .card .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .card .v{font-size:22px;font-weight:700}
  .rerun{margin-left:auto;background:var(--accent);border:0;color:#fff;border-radius:9px;
    padding:8px 15px;font-size:14px;font-weight:600;cursor:pointer}
  .rerun:disabled{opacity:.6;cursor:default}
  input{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:9px;
    padding:8px 12px;font-size:14px;min-width:180px;margin-left:8px}
  ul{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  li{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
  li:last-child{border-bottom:0}
  li:hover{background:var(--panel2)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);margin-top:6px;flex:0 0 auto}
  .body{flex:1}
  .name{font-weight:500}
  .meta{color:var(--dim);font-size:12px;margin-top:3px}
  .pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:20px;background:var(--panel2);
    border:1px solid var(--line);color:var(--dim);margin-right:6px}
  .empty{padding:26px;text-align:center;color:var(--dim)}
</style></head>
<body><div class="wrap">
  <h1>Markology To-Do</h1>
  <div class="sub">Your own agency tasks (Markology, Course, internal) due today · <span id="gen">loading…</span></div>
  <div class="row1">
    <div class="card"><div class="k">To do</div><div class="v" id="c-n">–</div></div>
    <button id="rerun" class="rerun" onclick="rerun()">⟳ Rerun</button>
    <input id="q" placeholder="Filter…" oninput="draw()">
  </div>
  <ul id="list"></ul>
</div>
<script>
let T=[];
function draw(){
  const q=(document.getElementById('q').value||'').toLowerCase().trim();
  const rows=T.filter(t=>!q||[t.name,t.dept,t.owner].join(' ').toLowerCase().includes(q));
  document.getElementById('c-n').textContent=rows.length;
  const el=document.getElementById('list');
  if(!rows.length){el.innerHTML='<div class="empty">Nothing on the Markology list today. 🎉</div>';return;}
  el.innerHTML=rows.map(t=>`<li><span class="dot"></span><div class="body">
    <div class="name">${t.prio?'🔴 ':''}${t.name}</div>
    <div class="meta"><span class="pill">${t.dept}</span><span class="pill">${t.status}</span>${t.owner}</div>
  </div></li>`).join('');
}
async function rerun(){
  const btn=document.getElementById('rerun'); btn.disabled=true; btn.textContent='Refreshing…';
  try{
    const r=await fetch('/api/tasks-due',{cache:'no-store'});
    const d=await r.json();
    if(d.error){ document.getElementById('gen').textContent='live error: '+d.error; }
    else { T=(d.tasks||[]).filter(t=>t.markology); document.getElementById('gen').textContent=(d.generated||'')+' · LIVE'; }
  }catch(e){ document.getElementById('gen').textContent='portal service not running'; }
  draw(); btn.disabled=false; btn.textContent='⟳ Rerun';
}
rerun();
</script>
