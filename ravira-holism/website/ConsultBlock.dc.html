<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Ravira: ConsultBlock</title>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section id="consult" style="background:#E3E9DC;padding:clamp(64px,8cqi,112px) clamp(20px,5cqi,72px);font-family:'Nunito Sans',sans-serif;color:#27302A">
  <div style="max-width:1296px;margin:0 auto;display:flex;flex-wrap:wrap;gap:48px 72px;align-items:center">
    <div style="flex:1 1 360px;min-width:0">
      <svg viewBox="0 0 400 120" style="width:220px;height:66px;overflow:visible;display:block" fill="none"><path d="M74 60 C70 57 57 45 52 44 C47 42 44 44 43 49 C43 55 53 74 51 78 C49 82 27 79 30 74 C33 69 65 49 69 48 C74 47 61 65 57 71 C53 77 40 87 47 83 C54 79 86 53 100 47 C113 40 120 41 130 43 C140 44 150 53 160 58 C170 62 180 69 190 71 C200 72 210 70 220 68 C230 66 240 60 250 58 C260 55 270 54 280 54 C290 53 300 56 310 57 C320 58 335 60 340 60" stroke="#27302A" stroke-width="2.4" stroke-linecap="round"></path><ellipse cx="362" cy="62" rx="14" ry="9" stroke="#E27A5F" stroke-width="3"></ellipse></svg>
      <h2 style="font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(38px,4.8cqi,64px);line-height:1.03;letter-spacing:-.01em;margin:24px 0 0;text-wrap:pretty">{{ headline }}</h2>
      <p style="font-size:19px;line-height:1.6;color:#4A544C;margin:22px 0 0;max-width:500px">{{ subhead }}</p>
    </div>
    <form style="flex:1 1 360px;min-width:0;background:#FBFAF5;border-radius:28px;padding:clamp(24px,3cqi,40px);display:flex;flex-direction:column;gap:12px">
      <input type="text" placeholder="Name" aria-label="Name" style="font-family:inherit;font-size:16px;padding:16px 20px;border:1.5px solid #27302A;border-radius:14px;background:#FBFAF5;color:#27302A">
      <input type="email" placeholder="Email" aria-label="Email" style="font-family:inherit;font-size:16px;padding:16px 20px;border:1.5px solid #27302A;border-radius:14px;background:#FBFAF5;color:#27302A">
      <div style="display:flex;gap:8px;flex-wrap:wrap;font-size:15px">
        <span style="padding:11px 18px;border-radius:999px;background:#27302A;color:#FBFAF5;font-weight:700">Zoom</span>
        <span style="padding:10px 17px;border-radius:999px;border:1.5px solid #27302A">In person, East Bay</span>
      </div>
      <textarea rows="3" placeholder="What's going on for you right now?" aria-label="What's going on for you right now?" style="font-family:inherit;font-size:16px;padding:16px 20px;border:1.5px solid #27302A;border-radius:14px;background:#FBFAF5;color:#27302A;resize:vertical"></textarea>
      <a href="05-Contact.dc.html" style="text-align:center;background:#E27A5F;color:#27302A;padding:18px 30px;border-radius:999px;font-weight:700;font-size:17px;text-decoration:none;margin-top:6px">{{ button }}</a>
      <div style="text-align:center;font-size:14px;color:#5B655C">{{ subtext }}</div>
    </form>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1440px&quot;,&quot;height&quot;:&quot;640px&quot;},&quot;headline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;When life gets shaky, have a way back.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subhead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Let's talk about where you are and what feels stuck.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;button&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Book a Free Consultation&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtext&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;20 minutes, by phone or video.&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      headline: p.headline ?? 'When life gets shaky, have a way back.',
      subhead: p.subhead ?? "Let's talk about where you are and what feels stuck. You don't need an agenda. We start wherever you are that day.",
      button: p.button ?? 'Book a Free Consultation',
      subtext: p.subtext ?? '20 minutes, by phone or video.'
    };
  }
}
</script>
</body>
</html>
