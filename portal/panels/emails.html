<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Action Emails</title>
<style>
  :root{--bg:#0d1017;--panel:#151a23;--panel2:#1b212c;--line:#232b38;--ink:#e8edf4;
    --dim:#8a96a8;--accent:#3872EB;--accent2:#7DA4F4;--warn:#d6a53c;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:26px 20px 60px}
  h1{font-size:21px;margin:0 0 2px;font-weight:700}
  .sub{color:var(--dim);font-size:13px;margin-bottom:16px}
  .row1{display:flex;gap:12px;align-items:center;margin-bottom:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 15px}
  .card .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .card .v{font-size:22px;font-weight:700}
  .rerun{margin-left:auto;background:var(--accent);border:0;color:#fff;border-radius:9px;
    padding:8px 15px;font-size:14px;font-weight:600;cursor:pointer}
  .rerun:disabled{opacity:.6;cursor:default}
  input{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:9px;
    padding:8px 12px;font-size:14px;min-width:170px;margin-left:8px}
  ul{list-style:none;margin:0;padding:0}
  li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
  li:hover{border-color:var(--accent)}
  .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .subj{font-weight:600;font-size:15px}
  .subj a{color:var(--ink);text-decoration:none}
  .subj a:hover{color:var(--accent2)}
  .date{color:var(--dim);font-size:12px;white-space:nowrap}
  .meta{color:var(--dim);font-size:12.5px;margin-top:4px}
  .chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:20px;background:var(--panel2);
    border:1px solid var(--line);color:var(--accent2);margin-right:7px;font-weight:600}
  .note{color:var(--dim);font-size:13px;margin-top:7px;font-style:italic}
  .att{color:var(--warn);font-size:12px;margin-left:6px}
  .empty{padding:26px;text-align:center;color:var(--dim)}
</style></head>
<body><div class="wrap">
  <h1>Action Emails</h1>
  <div class="sub">Outlook <b>Action</b> folder — what's outstanding · <span id="gen">loading…</span></div>
  <div class="row1">
    <div class="card"><div class="k">Outstanding</div><div class="v" id="c-n">–</div></div>
    <button id="rerun" class="rerun" onclick="rerun()">⟳ Rerun</button>
    <input id="q" placeholder="Filter…" oninput="draw()">
  </div>
  <ul id="list"></ul>
</div>
<script>
let E=[];
function draw(){
  const q=(document.getElementById('q').value||'').toLowerCase().trim();
  const rows=E.filter(e=>!q||[e.subject,e.from,e.client,e.note].join(' ').toLowerCase().includes(q));
  document.getElementById('c-n').textContent=rows.length;
  const el=document.getElementById('list');
  if(!rows.length){el.innerHTML='<div class="empty">Action folder is clear. 🎉</div>';return;}
  el.innerHTML=rows.map(e=>`<li>
    <div class="top"><div class="subj"><a href="${e.link}" target="_blank" rel="noopener">${e.subject}</a>${e.att?'<span class="att">📎</span>':''}</div>
      <div class="date">${e.date}</div></div>
    <div class="meta"><span class="chip">${e.client}</span>${e.from}</div>
    ${e.note?`<div class="note">${e.note}</div>`:''}
  </li>`).join('');
}
async function rerun(){
  const b=document.getElementById('rerun'); b.disabled=true; b.textContent='Refreshing…';
  try{ const r=await fetch('/api/emails',{cache:'no-store'}); const d=await r.json();
    E=d.emails||[]; document.getElementById('gen').textContent=(d.generated||'')+' (snapshot)'; }
  catch(e){ document.getElementById('gen').textContent='portal service not running'; }
  draw(); b.disabled=false; b.textContent='⟳ Rerun';
}
rerun();
</script>
