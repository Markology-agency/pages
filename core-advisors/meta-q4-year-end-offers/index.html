<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Core Year-End Offer Ads</title>
<style>
@font-face{font-family:'Euclid Circular B';src:url('https://coreadvisors.com/wp-content/uploads/2024/12/Euclid-Circular-B-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Euclid Circular B';src:url('https://coreadvisors.com/wp-content/uploads/2024/12/Euclid-Circular-B-SemiBold.ttf') format('truetype');font-weight:600;font-display:swap}
:root{--navy:#092d4f;--green:#3a975b;--light:#d5ecf6;--bg:#eef2f5;--ink:#1c1e21;--muted:#65676b;--line:#dadde1}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:36px 16px 32px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header .wrap{padding:0}
header h1{font-family:'Euclid Circular B',sans-serif;font-weight:600;font-size:clamp(26px,4vw,36px);line-height:1.15}
header p{margin-top:8px;color:#cfe3f0;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:36px 28px;padding:40px 0 56px}
.slot{display:flex;flex-direction:column;gap:8px}
.slot .label{font-family:'Euclid Circular B',sans-serif;font-size:13px;font-weight:600;color:var(--navy);text-transform:uppercase;letter-spacing:.06em}
.fb{width:100%;max-width:400px;background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.12);overflow:hidden}
.fb .top{display:flex;gap:10px;align-items:center;padding:12px 14px 8px}
.av{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;flex:none;display:flex;align-items:center;justify-content:center;font:600 18px 'Euclid Circular B',sans-serif}
.av::before{content:'c'}
.fb .name{font-weight:600;font-size:15px}
.fb .meta{font-size:13px;color:var(--muted)}
.fb .dots{margin-left:auto;color:var(--muted);font-size:20px;line-height:1}
.fb .text{padding:2px 14px 12px;font-size:15px;line-height:1.38;white-space:pre-line}
.fb img{display:block;width:100%;height:auto}
.fb .cta{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#f0f2f5}
.fb .cta .h{flex:1;min-width:0}
.fb .cta .url{font-size:12px;color:var(--muted);text-transform:uppercase}
.fb .cta .hl{font-weight:600;font-size:15px}
.btn{flex:none;background:#e4e6eb;color:var(--ink);font-weight:600;font-size:14px;padding:8px 14px;border-radius:6px}
.fb .actions{display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid var(--line);margin:0 14px;color:var(--muted);font-weight:600;font-size:14px}
footer{padding:0 16px 40px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Core Advisors Year-End Offer Ads</h1>
  <p>Four offers for the Facebook and Instagram feed. Pick the ones you're comfortable running.</p>
</div></header>
<main class="wrap"><div class="grid" id="ads"></div></main>
<footer>Prepared by Markology for Core Advisors.</footer>
<script>
const ADS = [
  {label:"Offer 1 · Free year-end planning review", img:"q1-year-end-review", hl:"Free Year-End Planning Review", btn:"Book Now",
   text:"Dentists, most of the moves that lower your 2026 tax bill have to happen before December 31. Equipment, owner pay, retirement contributions and your entity setup all need a decision this year. Don't wait until January, when you lose the options to save.\n\nBook a free year-end planning review with Core. We only work with dental practices."},
  {label:"Offer 2 · Free preliminary review", img:"q2-10k-preliminary-review", hl:"Free Preliminary Tax Review", btn:"Get Offer",
   text:"Dentists, is there $10,000 sitting in your practice's tax plan? Send us your last return and a Core tax advisor will do a free preliminary review before year-end. We look at your owner pay and S-corp setup, the equipment you bought this year and your retirement plan, then show you what's still open before December 31."},
  {label:"Offer 3 · Switch before Dec 31", img:"q3-switch-1000", hl:"Save $1,000 When You Switch", btn:"Get Offer",
   text:"Dentists, if your CPA, your financial advisor and your bookkeeper have never been on the same call, you're the one connecting the dots. At Core it's one team for your tax planning, books, payroll and retirement, and we only work with dentists.\n\nSwitch to Core before December 31 and we'll take $1,000 off your first year."},
  {label:"Offer 4 · Free P&L review", img:"q4-free-pl-review", hl:"Free P&L Review for Dentists", btn:"Learn More",
   text:"Dentists, when did someone last read your P&L with you line by line? Send us your year-to-date P&L and a Core dental CFO will go through it on a free 30-minute call. We'll point out what stands out and what your numbers mean for your 2026 taxes."}
];
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
document.getElementById("ads").innerHTML = ADS.map(a => `
  <div class="slot"><span class="label">${esc(a.label)}</span>
  <div class="fb">
    <div class="top"><div class="av"></div><div><div class="name">Core Advisors</div><div class="meta">Sponsored · 🌐</div></div><div class="dots">···</div></div>
    <div class="text">${esc(a.text)}</div>
    <img src="img/${a.img}-1080x1350.jpg" alt="${esc(a.label)}" loading="lazy">
    <div class="cta"><div class="h"><div class="url">coreadvisors.com</div><div class="hl">${esc(a.hl)}</div></div><span class="btn">${a.btn}</span></div>
    <div class="actions"><span>👍 Like</span><span>💬 Comment</span><span>↗ Share</span></div>
  </div></div>`).join("");
</script>
</body>
</html>
