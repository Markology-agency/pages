<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet"/>
<title>Markology</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--paper:#F9F9FF;--navy:#070630;--blue:#3872EB;--lilac:#E6E9FF;--ink:#070630;--mute:#6C6E8A;--hair:rgba(7,6,48,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;font-size:15px;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.container{max-width:640px;margin:0 auto;padding:80px 32px;text-align:center;}
@media(max-width:720px){.container{padding:56px 20px;}}
.pill{display:inline-block;padding:6px 14px;background:var(--blue);color:#fff;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;font-weight:700;border-radius:999px;border:2px solid var(--navy);box-shadow:4px 4px 0 var(--navy);}
h1{font-family:'Anton','Impact',sans-serif;font-size:clamp(48px,9vw,88px);line-height:0.92;letter-spacing:0.02em;color:var(--navy);margin:24px 0 0;}
.accent{color:var(--blue);}
.lede{font-size:18px;color:var(--mute);margin-top:24px;}
.foot{margin-top:48px;font-size:13px;color:var(--mute);}
.foot a{color:var(--blue);text-decoration:none;font-weight:600;}
</style>
</head>
<body>
<div class="container">
  <span class="pill">Markology</span>
  <h1>PRIVATE<br/><span class="accent">CLIENT PORTAL.</span></h1>
  <p class="lede">This portal hosts confidential Markology client reports. Access is restricted. If you're a Markology client and can't reach your reports, contact your account lead.</p>
  <div class="foot">Visit <a href="https://markology.io">markology.io</a></div>
</div>
</body></html>
